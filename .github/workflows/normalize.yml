name: Normalize Events Data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci || npm install
      - name: Verify event data schema
        if: github.event_name == 'pull_request'
        run: node scripts/events-normalize.mjs --check
      - name: Normalize event data
        if: github.event_name == 'push'
        run: npm run events:normalize
      - name: Commit normalized events
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: normalize events data"
          branch: ${{ github.ref_name }}
