name: Events Data Schema Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci || npm install
      - name: Verify event data schema
        run: npm run events:normalize -- --check
