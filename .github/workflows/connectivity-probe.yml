name: Connectivity Probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Connectivity probe (HEAD robots.txt / ICS / JSON)
        run: |
          set -e
          urls=(
            https://calendar.aurora.ca/robots.txt
            https://calendar.eastgwillimbury.ca/robots.txt
            https://calendar.georgina.ca/robots.txt
            https://calendar.newmarket.ca/robots.txt
            https://calendar.townofws.ca/robots.txt
            https://calendar.uxbridge.ca/robots.txt
            https://calendar.scugog.ca/robots.txt
            https://www.exploregeorgina.ca/wp-json/tribe/events/v1/events
            https://discoverstouffville.ca/wp-json/tribe/events/v1/events
            https://discoveruxbridge.ca/wp-json/tribe/events/v1/events
            https://www.experienceyorkregion.com/wp-json/tribe/events/v1/events
            https://auroratownsquare.ca/events.ics
            https://auroraculturalcentre.ca/events.ics
            https://www.theglen.ca/events.ics
            https://uxbridgemusichall.com/events.ics
            https://www.aurorapl.ca/events.ics
            https://www.newmarketpl.ca/events.ics
            https://www.georginalibrary.ca/events.ics
            https://www.egpl.ca/events.ics
            https://uxlib.com/events.ics
            https://www.wsplibrary.ca/events.ics
            https://www.scugoglibrary.ca/events.ics
            https://business.aurorachamber.org/events.ics
            https://newmarketmainstreet.ca/events.ics
            https://stouffvillemainstreet.ca/events.ics
            https://uxbridgebia.com/events.ics
            https://suttonbia.com/events.ics
            https://jacksonspointbia.com/events.ics
            https://discoverportperry.ca/events.ics
          )
          for u in "${urls[@]}"; do
            echo "==> Checking $u"
            curl -I -sS --max-time 12 "$u" | sed -n '1,5p' || echo "curl failed for $u"
            echo
          done
