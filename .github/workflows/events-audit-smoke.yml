name: Events Audit Smoke Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run unit tests
        run: npm test
      - name: Audit known working source
        run: npm run events:audit -- --domain=aurora.ca
