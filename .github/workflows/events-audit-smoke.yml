name: Events Audit Smoke Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests (with minimal env defaults)
        env:
          SYNC_SECRET: test-secret
          GITHUB_REPO: ""
          GITHUB_REPO_OWNER: finally-home-agents
          GITHUB_REPO_NAME: northsidegta-site
          GH_TOKEN: ghp_dummy
          RATE_LIMIT_TEST_REDIS_PORT: 6379
        run: npm test
      - name: Audit known working source
        run: npm run events:audit -- --domain=aurora.ca
