name: Daily Events Sync

on:
  schedule:
    # 06:00 America/Toronto ~ 10:00 UTC during DST, ~11:00 UTC otherwise.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/sync-events.mjs
      - name: Commit & push changes
        run: |
          git config user.name "events-sync-bot"
          git config user.email "actions@github.com"
          git add public/data/events || true
          git diff --cached --quiet && echo "No event changes" && exit 0
          git commit -m "chore(events-sync): update events"
          git push
