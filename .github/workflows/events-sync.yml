name: Daily Events Sync

on:
  schedule:
    - cron: '0 8 * * *'    # once daily at 8AM
  workflow_dispatch: {}     # manual trigger from the Actions tab
  repository_dispatch:
    types: [sync-now]       # only run when /api/sync-now triggers it


permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      EVENTS_SYNC_WRITE: 'true'
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          set -euo pipefail
          git config --global user.name "northside-ci-bot"
          git config --global user.email "ci@northsidegta.local"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Determine sync mode
        id: mode
        env:
          SECRET_MODE: ${{ secrets.EVENTS_ADMIN_USE_PR }}
          VAR_MODE: ${{ vars.EVENTS_ADMIN_USE_PR }}
        run: |
          set -euo pipefail
          INPUT="${SECRET_MODE:-${VAR_MODE:-}}"
          NORMALIZED=$(printf '%s' "$INPUT" | tr '[:upper:]' '[:lower:]')
          if [ "$NORMALIZED" = "true" ]; then
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          else
            echo "mode=direct" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare branch for PR mode
        if: steps.mode.outputs.mode == 'pr'
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B ci/events-sync origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run events sync
        run: node scripts/sync-events.mjs

      - name: Stage generated files
        run: |
          set -euo pipefail
          git add public/data/events \
            public/data/sync-reports \
            public/sitemap.xml \
            config/event-feeds.json \
            logs/events-url-updates.log 2>/dev/null || true

      - name: Create commit with generated data
        id: commit
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SUMMARY="public/data/events/_sync-summary.json"
          MESSAGE="chore(events-sync): update events"
          if [ -f "$SUMMARY" ]; then
            CREATED=$(node -e "console.log((require('./${SUMMARY}').created ?? 0))")
            UPDATED=$(node -e "console.log((require('./${SUMMARY}').updated ?? 0))")
            ERRORS=$(node -e "console.log((require('./${SUMMARY}').errors ?? 0))")
            MESSAGE="chore(events-sync): +${CREATED} new, ${UPDATED} updated, ${ERRORS} errors"
          fi

          git commit -m "$MESSAGE"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Push commit to main
        if: steps.mode.outputs.mode == 'direct' && steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty before attempting to rebase; refusing to pull." >&2
            git status
            exit 1
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Push branch for PR
        if: steps.mode.outputs.mode == 'pr' && steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git push --force-with-lease origin ci/events-sync

      - name: Open or update pull request
        if: steps.mode.outputs.mode == 'pr' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if gh pr view ci/events-sync >/dev/null 2>&1; then
            gh pr edit ci/events-sync \
              --title "Automated events sync" \
              --body "Automated updates from the scheduled events sync." \
              --add-label automation
          else
            gh pr create \
              --title "Automated events sync" \
              --body "Automated updates from the scheduled events sync." \
              --base main \
              --head ci/events-sync \
              --label automation
          fi
