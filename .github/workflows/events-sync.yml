name: Daily Events Sync

on:
  schedule:
    - cron: '0 8 * * *'    # once daily at 8AM Toronto time (runner UTC; adjust as needed)
  workflow_dispatch: {}     # manual trigger from Actions tab
  repository_dispatch:
    types: [sync-now]       # only run when /api/sync-now triggers this specific type

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    # prevent overlapping runs (e.g., if multiple triggers happen close together)
    concurrency:
      group: events-sync
      cancel-in-progress: true

    env:
      # write artifacts to repo
      EVENTS_SYNC_WRITE: 'true'
      # tokens (use your repo secret GH_TOKEN if you have one; otherwise GITHUB_TOKEN works)
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      # optional proxy support if you add these secrets later
      HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
      HTTP_PROXY:  ${{ secrets.HTTP_PROXY }}
      NO_PROXY:    ${{ secrets.NO_PROXY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          set -euo pipefail
          git config --global user.name "northside-ci-bot"
          git config --global user.email "ci@northsidegta.local"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Determine sync mode (direct vs PR)
        id: mode
        env:
          SECRET_MODE: ${{ secrets.EVENTS_ADMIN_USE_PR }}
          VAR_MODE: ${{ vars.EVENTS_ADMIN_USE_PR }}
        run: |
          set -euo pipefail
          INPUT="${SECRET_MODE:-${VAR_MODE:-}}"
          NORMALIZED=$(printf '%s' "$INPUT" | tr '[:upper:]' '[:lower:]')
          if [ "$NORMALIZED" = "true" ]; then
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          else
            echo "mode=direct" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare branch for PR mode
        if: steps.mode.outputs.mode == 'pr'
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B ci/events-sync origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Quick egress probe
        run: |
          curl -I https://www.google.com
          node -e "fetch('https://example.com').then(r=>console.log('fetch ok', r.status)).catch(e=>{console.error('fetch failed', e);process.exit(1)})"

      - name: Connectivity preflight
        run: npm run events:connectivity

      - name: Run events sync
        run: node scripts/sync-events.mjs

      - name: Stage generated files
        run: |
          set -euo pipefail
          git add -A \
            public/data/events \
            public/data/sync-reports \
            public/sitemap.xml \
            config/event-feeds.json \
            logs/events-url-updates.log 2>/dev/null || true

      - name: Create commit with generated data
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SUMMARY="public/data/events/_sync-summary.json"
          MESSAGE="chore(events-sync): update events"
          if [ -f "$SUMMARY" ]; then
            CREATED=$(node -e "console.log((require('./${SUMMARY}').created ?? 0))")
            UPDATED=$(node -e "console.log((require('./${SUMMARY}').updated ?? 0))")
            ERRORS=$(node -e "console.log((require('./${SUMMARY}').errors ?? 0))")
            MESSAGE="chore(events-sync): +${CREATED} new, ${UPDATED} updated, ${ERRORS} errors"
          fi

          git commit -m "$MESSAGE"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # --- Safe push blocks ---

      - name: Commit and push safely (direct mode)
        if: steps.mode.outputs.mode == 'direct' && steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # ensure nothing is left unstaged
          git add -A public/data/events _sync-summary.json || true
          # commit only if anything new got staged
          git diff --cached --quiet || git commit -m "chore(events): auto-sync"
          # push; if it races with another run, retry safely
          git push origin HEAD:main || {
            echo "Retrying push after rebase…"
            git pull --rebase --autostash || true
            git push --force-with-lease origin HEAD:main
          }

      - name: Commit and push PR branch (PR mode)
        if: steps.mode.outputs.mode == 'pr' && steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add -A public/data/events _sync-summary.json || true
          git diff --cached --quiet || git commit -m "chore(events): auto-sync"
          git push --force-with-lease origin ci/events-sync

      - name: Open or update pull request (PR mode)
        if: steps.mode.outputs.mode == 'pr' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if gh pr view ci/events-sync >/dev/null 2>&1; then
            gh pr edit ci/events-sync \
              --title "Automated events sync" \
              --body "Automated updates from the scheduled events sync." \
              --add-label automation
          else
            gh pr create \
              --title "Automated events sync" \
              --body "Automated updates from the scheduled events sync." \
              --base main \
              --head ci/events-sync \
              --label automation
          fi

