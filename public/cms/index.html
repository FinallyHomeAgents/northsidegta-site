<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NorthSide GTA CMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif;
        color:#0f172a;
      }
      body.cms-loaded { display:block; background:#f8fafc; }

      /* Top controls (only visible once CMS UI is mounted) */
      #cms-controls{position:fixed;top:16px;right:16px;z-index:1000;display:none}
      body.cms-loaded #cms-controls{display:block}
      #events-admin-link{
        margin-right:12px;padding:8px 16px;border-radius:999px;background:rgba(37,99,235,.12);
        color:#1d4ed8;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;gap:6px
      }
      #logout-button{padding:8px 14px;border-radius:999px;border:none;background:#0f172a;color:#f8fafc;font-size:13px;font-weight:600;cursor:pointer}

      /* Local login overlay */
      #login-container{
        width:min(90%,380px);background:rgba(255,255,255,.92);border-radius:18px;padding:32px 28px;
        box-shadow:0 25px 70px rgba(15,23,42,.35);backdrop-filter:blur(12px)
      }
      body.cms-loaded #login-container{display:none}
      h1{margin:0 0 16px;font-size:24px;font-weight:600;text-align:center;color:#0f172a}
      p.description{margin:0 0 24px;font-size:15px;color:#475569;text-align:center}
      label{display:block;margin-bottom:16px}
      label span{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:#1e293b}
      input[type='text'],input[type='password']{
        width:100%;padding:12px 14px;border-radius:10px;border:1px solid #cbd5f5;background:#f8fafc;font-size:14px
      }
      button[type='submit']{
        width:100%;padding:12px 16px;border:none;border-radius:999px;background:#2563eb;color:#fff;font-weight:600;font-size:15px;cursor:pointer
      }
      #login-status{min-height:20px;margin-top:16px;font-size:13px;text-align:center;color:#dc2626}

      /* Basic styles for dailySchedule control */
      .daily-schedule-widget h4{font-size:16px;margin:8px 0 10px}
      .daily-schedule-widget .day-block{
        border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:10px;margin-bottom:10px
      }
      .daily-schedule-widget button{
        background:#2563eb;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer
      }
      .daily-schedule-widget button:hover{background:#1d4ed8}
    </style>
  </head>
  <body>
    <!-- Controls visible once CMS is running -->
    <div id="cms-controls">
      <a id="events-admin-link" href="/community/events-admin" target="_blank" rel="noopener noreferrer">Community Events Admin</a>
      <button id="logout-button" type="button">Log out</button>
    </div>

    <!-- Local username/password login -->
    <div id="login-container">
      <form id="cms-login-form" autocomplete="on">
        <h1>Welcome back</h1>
        <p class="description">Sign in to manage your NorthSide GTA content.</p>
        <label>
          <span>Username</span>
          <input type="text" name="username" id="username" autocomplete="username" required />
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" id="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign in</button>
        <div id="login-status" role="status" aria-live="polite"></div>
      </form>
    </div>

    <!-- Single, pinned Decap bundle -->
    <script>
      /* We’ll init manually once we’ve set up our widget shims */
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js"></script>

    <script>
      (function () {
        const STORAGE_KEYS = ['decap-cms-user', 'netlify-cms-user'];
        const form = document.getElementById('cms-login-form');
        const statusEl = document.getElementById('login-status');
        const logoutButton = document.getElementById('logout-button');
        const submitButton = form.querySelector("button[type='submit']");
        const defaultButtonText = submitButton.textContent;
        let cmsHasInitialized = false;   // guard against double init
        let widgetUpgraded = false;      // only upgrade widget once

        function setStatus(message, isError){ statusEl.textContent = message || ''; statusEl.style.color = isError ? '#dc2626' : '#0f172a'; }
        function setLoading(isLoading){ submitButton.disabled = isLoading; submitButton.textContent = isLoading ? 'Signing in…' : defaultButtonText; }

        function clearStoredTokens(){
          try{ STORAGE_KEYS.forEach((k)=>localStorage.removeItem(k)); }catch{}
        }
        function storeToken(token, username){
          try{
            const name = (typeof username==='string' && username.trim()) ? username.trim() : 'CMS User';
            const payload = JSON.stringify({ token, backendName:'github', login:name, name });
            STORAGE_KEYS.forEach((k)=>localStorage.setItem(k,payload));
          }catch{}
        }
        function getStoredUser(){
          try{
            for (const k of STORAGE_KEYS){
              const raw = localStorage.getItem(k); if(!raw) continue;
              try{ const v = JSON.parse(raw); if(v && typeof v.token === 'string' && v.token.length) return v; }
              catch{ localStorage.removeItem(k); }
            }
          }catch{}
          return null;
        }

        /** Registers a harmless placeholder for 'dailySchedule' so Decap never errors,
         * then later upgrades to the React control once React is available. */
        function registerPlaceholderWidget() {
          if (!window.CMS || !CMS.getWidget) return;
          const already = CMS.getWidget('dailySchedule');
          if (already?.control) return; // nothing to do

          const base = CMS.getWidget('list') || CMS.getWidget('object') || CMS.getWidget('string');
          if (base?.control) {
            CMS.registerWidget('dailySchedule', base.control, base.preview);
            console.info('[cms] dailySchedule placeholder registered');
          }
        }

        /** Upgrades the widget to a React control once CMS.imports.React is present */
        function tryUpgradeWidget() {
          if (widgetUpgraded) return;
          try {
            const React = CMS?.imports?.React;
            if (!React || !React.useState) return; // not yet
            const { useState } = React;

            function DailyScheduleControl({ value = [], onChange }) {
              const [days, setDays] = useState(value || []);
              const addDay = () => { const next=[...days,{date:'',start:'',end:'',allDay:false}]; setDays(next); onChange(next); };
              const update = (i, field, val) => { const next=days.map((d,idx)=>idx===i?{...d,[field]:val}:d); setDays(next); onChange(next); };
              const remove = (i) => { const next=days.filter((_,idx)=>idx!==i); setDays(next); onChange(next); };

              return React.createElement("div",{className:"daily-schedule-widget"},[
                React.createElement("h4",{key:"t"},"Daily Schedule"),
                ...days.map((d,i)=>React.createElement("div",{key:i,className:"day-block"},[
                  React.createElement("input",{key:"date",type:"date",value:d.date,onChange:e=>update(i,'date',e.target.value),style:{display:"block",marginBottom:"8px",width:"100%"}}),
                  React.createElement("div",{key:"row",style:{display:"flex",gap:"8px"}},[
                    React.createElement("input",{key:"s",type:"time",value:d.start,onChange:e=>update(i,'start',e.target.value),style:{flex:1}}),
                    React.createElement("input",{key:"e",type:"time",value:d.end,onChange:e=>update(i,'end',e.target.value),style:{flex:1}}),
                    React.createElement("label",{key:"ad",style:{display:"flex",alignItems:"center",gap:"6px",fontSize:"14px"}},[
                      React.createElement("input",{type:"checkbox",checked:d.allDay,onChange:e=>update(i,'allDay',e.target.checked)}),
                      "All Day"
                    ])
                  ]),
                  React.createElement("button",{key:"rm",type:"button",onClick:()=>remove(i),style:{background:"#ef4444",marginTop:"8px"}},"Remove Day")
                ])),
                React.createElement("button",{key:"add",type:"button",onClick:()=>addDay(),style:{marginTop:"10px"}},"Add Another Day")
              ]);
            }
            function DailySchedulePreview({ value }) {
              return React.createElement("pre",{style:{background:"#f1f5f9",padding:"10px",borderRadius:"6px"}},JSON.stringify(value,null,2));
            }

            CMS.registerWidget('dailySchedule', DailyScheduleControl, DailySchedulePreview);
            widgetUpgraded = true;
            console.info('[cms] dailySchedule upgraded to React control');
          } catch (e) {
            console.warn('[cms] widget upgrade failed (will retry):', e);
          }
        }

        /** Boots Decap exactly once, then tries to upgrade the widget when React is available */
        function bootCMSOnce() {
          if (cmsHasInitialized) return;
          if (!window.CMS || typeof CMS.init !== 'function') {
            return setTimeout(bootCMSOnce, 50);
          }
          // Ensure placeholder exists BEFORE init to avoid "No control" errors.
          registerPlaceholderWidget();

          CMS.init(); // one and only init
          cmsHasInitialized = true;
          document.body.classList.add('cms-loaded');
          console.info('[cms] Decap initialized');

          // Poll a short time for React to appear, then upgrade widget.
          let tries = 0;
          const t = setInterval(() => {
            tryUpgradeWidget();
            if (widgetUpgraded || ++tries > 120) clearInterval(t);
          }, 100);
        }

        async function handleLogin(e){
          e.preventDefault();
          const fd = new FormData(form);
          const username = (fd.get('username') || '').trim();
          const password = fd.get('password') || '';
          if (!username || !password){ setStatus('Enter both your username and password.', true); return; }
          setLoading(true); setStatus('Signing in…', false);
          try{
            const res = await fetch('/api/cms-login', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ username, password }), credentials:'same-origin'
            });
            const payload = await res.json().catch(()=>({}));
            if(!res.ok || !payload.token){
              clearStoredTokens();
              setStatus(payload.error || 'Login failed. Please check your credentials.', true);
              setLoading(false);
              return;
            }
            storeToken(payload.token, username);
            setStatus('Signed in! Loading the CMS…', false);
            document.body.classList.add('cms-loaded'); // hide overlay
            setLoading(false);
            bootCMSOnce();
          }catch(err){
            console.error('[cms-login] request failed', err);
            setStatus('We could not reach the server. Please try again.', true);
            setLoading(false);
          }
        }

        function handleLogout(){ clearStoredTokens(); window.location.replace('/cms/'); }

        form.addEventListener('submit', handleLogin);
        logoutButton.addEventListener('click', handleLogout);

        // If already logged in, show CMS immediately
        if (getStoredUser()){
          document.body.classList.add('cms-loaded');
          bootCMSOnce();
        } else {
          requestAnimationFrame(()=>{ try{ document.getElementById('username')?.focus(); }catch{} });
        }
      })();
    </script>
  </body>
</html>
