<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NorthSide GTA CMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body,
      #nc-root {
        height: 100%;
        margin: 0;
      }
    </style>
    <!-- No CMS_MANUAL_INIT. Let Decap auto-init. -->
  </head>
  <body>
    <div id="nc-root"></div>

    <!-- Load a stable build -->
    <script src="https://unpkg.com/decap-cms@3.6.2/dist/decap-cms.js"></script>

    <!-- Inline config so Decap picks it up on boot -->
    <script>
      window.CMS_CONFIG = {
        backend: {
          name: 'github',
          repo: 'FinallyHomeAgents/northsidegta-site',
          branch: 'main',
          base_url: 'https://northsidegta.ca',
          auth_endpoint: '/api/oauth/start',
        },
        media_folder: 'public/uploads',
        public_folder: '/uploads',
        collections: [
          {
            name: 'collections',
            label: 'Curated Collections',
            folder: 'public/data/collections',
            create: true,
            extension: 'json',
            format: 'json',
            identifier_field: 'slug',
            slug: '{{slug}}',
            fields: [
              { name: 'title', label: 'Page Title' },
              {
                name: 'slug',
                label: 'Slug (URL part)',
                widget: 'string',
                pattern: [
                  '^[a-z0-9-]+$',
                  'Use lowercase letters, numbers, and dashes only',
                ],
              },
              { name: 'intro', label: 'Intro (optional)', required: false },
              { name: 'realmLink', label: 'Realm Link (the private URL)' },
              {
                name: 'heroImage',
                label: 'Hero Image',
                widget: 'image',
                required: false,
              },
            ],
          },
        ],
      }
    </script>

    <!-- Light helper: if token already exists, nudge to collections after load -->
    <script>
      window.addEventListener('load', function () {
        try {
          const raw =
            localStorage.getItem('decap-cms-user') ||
            localStorage.getItem('netlify-cms-user')
          if (raw) {
            const u = JSON.parse(raw)
            if (
              u &&
              u.token &&
              (!location.hash ||
                location.hash === '#/' ||
                location.hash === '#/login')
            ) {
              location.hash = '#/collections/collections'
            }
          }
        } catch (_) {}
      })
    </script>
  </body>
</html>
