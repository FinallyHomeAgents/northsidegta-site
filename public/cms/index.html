<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>NorthSide GTA CMS</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #0f172a;
      }

      body.cms-loaded {
        display: block;
        background: #f8fafc;
      }

      #login-container {
        width: min(90%, 380px);
        background: rgba(255, 255, 255, 0.92);
        border-radius: 18px;
        padding: 32px 28px;
        box-shadow: 0 25px 70px rgba(15, 23, 42, 0.35);
        backdrop-filter: blur(12px);
        transition: opacity 0.3s ease;
      }

      body.cms-loaded #login-container {
        display: none;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
        font-weight: 600;
        text-align: center;
        color: #0f172a;
      }

      p.description {
        margin: 0 0 24px;
        font-size: 15px;
        color: #475569;
        text-align: center;
      }

      label {
        display: block;
        margin-bottom: 16px;
      }

      label span {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 6px;
        color: #1e293b;
      }

      input[type='text'],
      input[type='password'] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #cbd5f5;
        background-color: #f8fafc;
        font-size: 14px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input[type='text']:focus,
      input[type='password']:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        background-color: #fff;
      }

      button[type='submit'] {
        width: 100%;
        padding: 12px 16px;
        border: none;
        border-radius: 999px;
        background-color: #2563eb;
        color: #ffffff;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.2s ease;
      }

      button[type='submit']:hover {
        background-color: #1d4ed8;
        transform: translateY(-1px);
      }

      button[type='submit']:disabled {
        background-color: #93c5fd;
        cursor: not-allowed;
        transform: none;
      }

      #login-status {
        min-height: 20px;
        margin-top: 16px;
        font-size: 13px;
        text-align: center;
        color: #dc2626;
      }

      #cms-controls {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 1000;
        display: none;
      }

      #events-admin-link {
        margin-right: 12px;
        padding: 8px 16px;
        border-radius: 999px;
        background-color: rgba(37, 99, 235, 0.12);
        color: #1d4ed8;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
      }

      #events-admin-link:hover,
      #events-admin-link:focus {
        background-color: rgba(37, 99, 235, 0.18);
        color: #1e3a8a;
        transform: translateY(-1px);
      }

      #events-admin-link:focus-visible {
        outline: 2px solid rgba(37, 99, 235, 0.8);
        outline-offset: 2px;
      }

      #logout-button {
        padding: 8px 14px;
        border-radius: 999px;
        border: none;
        background-color: rgba(15, 23, 42, 0.85);
        color: #f8fafc;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.02em;
      }

      #logout-button:hover {
        background-color: rgba(15, 23, 42, 1);
      }

      body.cms-loaded #cms-controls {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="cms-controls">
      <a
        id="events-admin-link"
        href="/community/events-admin"
        target="_blank"
        rel="noopener noreferrer"
      >
        Community Events Admin
      </a>
      <button id="logout-button" type="button">Log out</button>
    </div>
    <div id="login-container">
      <form id="cms-login-form" autocomplete="on">
        <h1>Welcome back</h1>
        <p class="description">Sign in to manage your NorthSide GTA content.</p>
        <label>
          <span>Username</span>
          <input
            type="text"
            name="username"
            id="username"
            autocomplete="username"
            required
          />
        </label>
        <label>
          <span>Password</span>
          <input
            type="password"
            name="password"
            id="password"
            autocomplete="current-password"
            required
          />
        </label>
        <button type="submit">Sign in</button>
        <div id="login-status" role="status" aria-live="polite"></div>
      </form>
    </div>

    <script>
      ;(function () {
        const CMS_SCRIPT_URLS = [
          'https://unpkg.com/decap-cms@3.6.2/dist/decap-cms.js',
          'https://cdn.jsdelivr.net/npm/decap-cms@3.6.2/dist/decap-cms.js',
        ]
        const STORAGE_KEYS = ['decap-cms-user', 'netlify-cms-user']
        let cmsEnhancementsReady = false
        let cmsEnhancementsPromise = null

        const CMS_POLL_INTERVAL = 100
        const CMS_POLL_TIMEOUT = 30000

        function getCmsContext(startWindow) {
          const visited = new Set()
          const queue = []

          const pushWindow = (candidate) => {
            if (!candidate || visited.has(candidate)) {
              return
            }
            visited.add(candidate)
            queue.push(candidate)
          }

          const resolveInWindow = (candidate) => {
            let cmsExport
            try {
              cmsExport = candidate.CMS
            } catch (error) {
              return null
            }

            if (!cmsExport) {
              return null
            }

            const cms =
              typeof cmsExport.registerWidget === 'function'
                ? cmsExport
                : cmsExport.default && typeof cmsExport.default.registerWidget === 'function'
                ? cmsExport.default
                : null

            if (!cms) {
              return null
            }

            let react =
              (cms.imports && (cms.imports.react || cms.imports.React)) ||
              cms.React ||
              cms.react ||
              candidate.React ||
              null

            if (react && react.default && typeof react.default.createElement === 'function') {
              react = react.default
            }

            if (
              !react ||
              typeof react.createElement !== 'function' ||
              typeof react.useState !== 'function'
            ) {
              return null
            }

            return { win: candidate, CMS: cms, React: react }
          }

          const topWindow = (() => {
            try {
              return startWindow && startWindow.top ? startWindow.top : window.top
            } catch (error) {
              return startWindow || window
            }
          })()

          pushWindow(topWindow)
          if (startWindow && startWindow !== topWindow) {
            pushWindow(startWindow)
          }
          if (typeof window !== 'undefined' && window !== topWindow && window !== startWindow) {
            pushWindow(window)
          }

          while (queue.length) {
            const candidate = queue.shift()
            const context = resolveInWindow(candidate)
            if (context) {
              return context
            }

            try {
              const frames = candidate.frames
              const frameCount = frames ? frames.length : 0
              for (let index = 0; index < frameCount; index += 1) {
                const frameWindow = frames[index]
                pushWindow(frameWindow)
              }
            } catch (error) {}

            try {
              const doc = candidate.document
              if (doc && typeof doc.querySelectorAll === 'function') {
                const iframeNodes = doc.querySelectorAll('iframe')
                iframeNodes.forEach((iframe) => {
                  if (iframe && iframe.contentWindow) {
                    pushWindow(iframe.contentWindow)
                  }
                })
              }
            } catch (error) {}
          }

          return null
        }

        function ensureCmsEnhancementsReady() {
          if (cmsEnhancementsReady) return Promise.resolve(true)
          if (cmsEnhancementsPromise) return cmsEnhancementsPromise

          cmsEnhancementsPromise = new Promise((resolve) => {
            const startTime = Date.now()

            const attempt = () => {
              const context = getCmsContext(window)
              if (
                context &&
                context.CMS &&
                typeof context.CMS.registerWidget === 'function' &&
                context.React
              ) {
                const { CMS, React, win: contextWindow } = context
                registerEventsPreview(CMS, React)
                registerDailyScheduleWidget(CMS, React, contextWindow)
                activateLegacyFieldStyling(contextWindow)
                applyCmsHeaderLayoutFix(contextWindow)
                cmsEnhancementsReady = true
                cmsEnhancementsPromise = null
                console.info('[cms] enhancements ready')
                resolve(true)
                return
              }

              if (Date.now() - startTime >= CMS_POLL_TIMEOUT) {
                cmsEnhancementsPromise = null
                console.warn('[cms] CMS unavailable after waiting 30s')
                resolve(false)
                return
              }

              window.setTimeout(attempt, CMS_POLL_INTERVAL)
            }

            attempt()
          })

          return cmsEnhancementsPromise
        }

        function registerEventsPreview(CMS, React) {
          if (!CMS || typeof CMS.registerPreviewTemplate !== 'function') {
            return
          }

          const { createElement } = React || {}
          if (typeof createElement !== 'function') {
            return
          }

          const headingFormatter = new Intl.DateTimeFormat('en-CA', {
            weekday: 'short',
            month: 'short',
            day: 'numeric',
            year: 'numeric',
          })

          const weekdayFormatter = new Intl.DateTimeFormat('en-CA', {
            weekday: 'short',
            month: 'short',
            day: 'numeric',
          })

          const monthDayFormatter = new Intl.DateTimeFormat('en-CA', {
            month: 'short',
            day: 'numeric',
          })

          const timeFormatter = new Intl.DateTimeFormat('en-CA', {
            hour: 'numeric',
            minute: '2-digit',
            hour12: true,
          })

          function toStringValue(value) {
            if (typeof value === 'string') return value.trim()
            if (typeof value === 'number') return String(value)
            return ''
          }

          function parseDate(value) {
            const safeValue = toStringValue(value)
            if (!safeValue) return null
            const date = new Date(safeValue)
            return Number.isNaN(date.getTime()) ? null : date
          }

          function isSameDay(a, b) {
            if (!(a instanceof Date) || !(b instanceof Date)) return false
            if (Number.isNaN(a.getTime()) || Number.isNaN(b.getTime())) return false
            return (
              a.getFullYear() === b.getFullYear() &&
              a.getMonth() === b.getMonth() &&
              a.getDate() === b.getDate()
            )
          }

          function startOfDay(date) {
            if (!(date instanceof Date) || Number.isNaN(date.getTime())) return null
            const copy = new Date(date.getTime())
            copy.setHours(0, 0, 0, 0)
            return copy
          }

          function formatMonthDay(date) {
            if (!(date instanceof Date) || Number.isNaN(date.getTime())) return ''
            const base = monthDayFormatter.format(date)
            const now = new Date()
            if (date.getFullYear() !== now.getFullYear()) {
              return `${base}, ${date.getFullYear()}`
            }
            return base
          }

          function normalizeMeridiem(value) {
            return value.replace(/\s?(a\.m\.|p\.m\.)/gi, (match) =>
              match.toLowerCase().includes('a') ? ' AM' : ' PM'
            )
          }

          function formatTimeRange(start, end) {
            const startText = normalizeMeridiem(timeFormatter.format(start))
            const endText = normalizeMeridiem(timeFormatter.format(end))
            const startSuffixMatch = startText.match(/\s(AM|PM)$/)
            const endSuffixMatch = endText.match(/\s(AM|PM)$/)
            if (startSuffixMatch && endSuffixMatch && startSuffixMatch[0] === endSuffixMatch[0]) {
              const startWithoutMeridiem = startText.replace(/\s(AM|PM)$/, '')
              return `${startWithoutMeridiem}–${endText}`
            }
            return `${startText}–${endText}`
          }

          function isAllDayRange(start, end) {
            if (!(start instanceof Date) || !(end instanceof Date)) return false
            if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return false
            const startIsMidnight =
              start.getHours() === 0 &&
              start.getMinutes() === 0 &&
              start.getSeconds() === 0
            const durationMs = end.getTime() - start.getTime()
            const oneDayMs = 24 * 60 * 60 * 1000
            return startIsMidnight && Math.abs(durationMs - oneDayMs) < 1000
          }

          function formatWhenText(start, end, allDay) {
            if (!(start instanceof Date) || Number.isNaN(start.getTime())) {
              return 'Date/Time TBA'
            }
            if (allDay) {
              return 'All day'
            }
            if (end instanceof Date && !Number.isNaN(end.getTime()) && isSameDay(start, end)) {
              return `${weekdayFormatter.format(start)}, ${formatTimeRange(start, end)}`
            }
            if (end instanceof Date && !Number.isNaN(end.getTime())) {
              const startPart = `${formatMonthDay(start)}, ${normalizeMeridiem(timeFormatter.format(start))}`
              const endPart = `${formatMonthDay(end)}, ${normalizeMeridiem(timeFormatter.format(end))}`
              return `${startPart} → ${endPart}`
            }
            return `${weekdayFormatter.format(start)}, ${normalizeMeridiem(timeFormatter.format(start))}`
          }

          function buildDayLabel(start) {
            if (!(start instanceof Date) || Number.isNaN(start.getTime())) return 'Date TBA'
            const today = startOfDay(new Date())
            const tomorrow = today ? new Date(today.getTime()) : null
            if (tomorrow) {
              tomorrow.setDate(tomorrow.getDate() + 1)
            }
            if (today && isSameDay(start, today)) return 'Today'
            if (tomorrow && isSameDay(start, tomorrow)) return 'Tomorrow'
            return headingFormatter.format(start)
          }

          function buildWhere(city, location, address) {
            const safeCity = toStringValue(city)
            const safeLocation = toStringValue(location)
            const safeAddress = toStringValue(address)
            if (safeCity && safeLocation) return `${safeCity} • ${safeLocation}`
            if (safeCity && safeAddress) return `${safeCity} • ${safeAddress}`
            if (safeCity) return safeCity
            if (safeLocation) return safeLocation
            if (safeAddress) return safeAddress
            return 'Location TBA'
          }

          function parseBoolean(value) {
            if (value === true || value === false) return value
            if (typeof value === 'string') {
              const normalized = value.trim().toLowerCase()
              return normalized === 'true' || normalized === '1' || normalized === 'yes'
            }
            return false
          }

          const infoRowStyle = {
            display: 'flex',
            alignItems: 'baseline',
            gap: '8px',
          }

          const infoLabelStyle = {
            minWidth: '52px',
            fontSize: '12px',
            fontWeight: 700,
            letterSpacing: '0.08em',
            textTransform: 'uppercase',
            color: '#64748b',
          }

          const infoValueStyle = {
            fontSize: '14px',
            fontWeight: 500,
            color: '#0f172a',
          }

          class EventPreview extends React.Component {
            render() {
              const data = this.props.entry && this.props.entry.get ? this.props.entry.get('data') : null
              const getField = (field) => (data && data.get ? data.get(field) : undefined)

              const title = toStringValue(getField('title')) || 'Untitled Event'
              const start = parseDate(getField('startDate'))
              const end = parseDate(getField('endDate'))
              const explicitAllDay = parseBoolean(getField('allDay'))
              const derivedAllDay = !explicitAllDay && isAllDayRange(start, end)
              const whenText = formatWhenText(start, end, explicitAllDay || derivedAllDay)
              const dayLabel = buildDayLabel(start)
              const city = getField('town')
              const locationName = getField('locationName') || getField('location')
              const address = getField('address')
              const whereText = buildWhere(city, locationName, address)
              const summary = toStringValue(getField('summary'))
              const eventUrl = toStringValue(getField('eventUrl'))

              const rootStyle = {
                fontFamily: "'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif",
                color: '#0f172a',
                backgroundColor: '#f8fafc',
                padding: '32px',
              }

              const chipStyle = {
                display: 'inline-flex',
                alignItems: 'center',
                padding: '6px 14px',
                borderRadius: '999px',
                backgroundColor: '#dbeafe',
                color: '#1d4ed8',
                fontSize: '12px',
                fontWeight: 600,
                letterSpacing: '0.06em',
                textTransform: 'uppercase',
                marginBottom: '16px',
              }

              const cardStyle = {
                backgroundColor: '#ffffff',
                borderRadius: '18px',
                boxShadow: '0 20px 40px rgba(15, 23, 42, 0.08)',
                border: '1px solid #e2e8f0',
                padding: '24px',
              }

              const titleStyle = {
                margin: '0 0 12px',
                fontSize: '22px',
                fontWeight: 700,
                lineHeight: 1.3,
                color: '#0f172a',
              }

              const summaryStyle = {
                marginTop: '16px',
                fontSize: '15px',
                lineHeight: 1.6,
                color: '#334155',
              }

              const linkStyle = {
                marginTop: '18px',
                fontSize: '14px',
                fontWeight: 600,
                color: '#2563eb',
                textDecoration: 'none',
              }

              return createElement(
                'div',
                { style: rootStyle },
                createElement('div', { style: chipStyle }, dayLabel),
                createElement(
                  'div',
                  { style: cardStyle },
                  createElement('h2', { style: titleStyle }, title),
                  createElement(
                    'div',
                    { style: { display: 'grid', rowGap: '10px' } },
                    createElement(
                      'div',
                      { style: infoRowStyle },
                      createElement('span', { style: infoLabelStyle }, 'When'),
                      createElement('span', { style: infoValueStyle }, whenText)
                    ),
                    createElement(
                      'div',
                      { style: infoRowStyle },
                      createElement('span', { style: infoLabelStyle }, 'Where'),
                      createElement('span', { style: infoValueStyle }, whereText)
                    )
                  ),
                  summary
                    ? createElement('p', { style: summaryStyle }, summary)
                    : null,
                  eventUrl
                    ? createElement(
                        'p',
                        { style: { margin: '18px 0 0' } },
                        createElement(
                          'a',
                          {
                            href: eventUrl,
                            target: '_blank',
                            rel: 'noopener noreferrer',
                            style: linkStyle,
                          },
                          'View details'
                        )
                      )
                    : null
                )
              )
            }
          }

          CMS.registerPreviewTemplate('events', EventPreview)
        }

        const dailyScheduleRegisteredWindows = new WeakSet()

        function registerDailyScheduleWidget(CMS, React, contextWindow) {
          if (!CMS || typeof CMS.registerWidget !== 'function' || !React) {
            return
          }

          const { useState, useEffect, useMemo, useRef } = React
          const targetWindow = contextWindow && contextWindow.document ? contextWindow : window

          if (dailyScheduleRegisteredWindows.has(targetWindow)) {
            return
          }

          const runtimeWindow = targetWindow
          const Immutable =
            (runtimeWindow && runtimeWindow.Immutable) ||
            (CMS && (CMS.Immutable || (CMS.imports && CMS.imports.Immutable))) ||
            null
          const promptFn =
            (runtimeWindow && runtimeWindow.prompt) || (typeof window !== 'undefined' ? window.prompt : null)
          const alertFn =
            (runtimeWindow && runtimeWindow.alert) || (typeof window !== 'undefined' ? window.alert : null)

          const containerStyle = {
            border: '1px solid #e2e8f0',
            borderRadius: '14px',
            padding: '16px',
            background: '#ffffff',
            display: 'flex',
            flexDirection: 'column',
            gap: '12px',
          }

          const headerStyle = {
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            flexWrap: 'wrap',
            gap: '8px',
          }

          const actionsStyle = {
            display: 'flex',
            gap: '8px',
            flexWrap: 'wrap',
          }

          const buttonStyle = {
            borderRadius: '999px',
            border: '1px solid #cbd5f5',
            background: '#f8fafc',
            color: '#1e3a8a',
            fontSize: '12px',
            fontWeight: 600,
            padding: '6px 12px',
            cursor: 'pointer',
          }

          const destructiveButtonStyle = {
            ...buttonStyle,
            borderColor: '#fecaca',
            color: '#b91c1c',
          }

          const rowStyle = {
            border: '1px solid #e2e8f0',
            borderRadius: '12px',
            padding: '12px',
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))',
            gap: '12px',
            alignItems: 'flex-end',
          }

          const fieldStyle = {
            display: 'flex',
            flexDirection: 'column',
            gap: '4px',
          }

          const labelStyle = {
            fontSize: '12px',
            fontWeight: 600,
            letterSpacing: '0.04em',
            textTransform: 'uppercase',
            color: '#475569',
          }

          const inputStyle = {
            borderRadius: '10px',
            border: '1px solid #cbd5f5',
            padding: '8px 10px',
            fontSize: '14px',
            background: '#f8fafc',
          }

          const checkboxWrapperStyle = {
            display: 'flex',
            alignItems: 'center',
            gap: '8px',
            paddingTop: '20px',
          }

          let rowIdCounter = 0

          function createRow(overrides = {}) {
            rowIdCounter += 1
            return {
              id: overrides.id || `row-${Date.now()}-${rowIdCounter}`,
              date: '',
              start_time: '',
              end_time: '',
              all_day: false,
              ...overrides,
            }
          }

          function normalizeRows(value) {
            if (!value) return []

            let raw = []
            if (Immutable && typeof Immutable.List === 'function' && Immutable.List.isList(value)) {
              raw = value.toJS()
            } else if (Array.isArray(value)) {
              raw = value
            } else if (value && typeof value === 'object' && typeof value.toJS === 'function') {
              try {
                raw = value.toJS()
              } catch (error) {
                raw = []
              }
            }

            if (!Array.isArray(raw)) return []

            const rows = []

            raw.forEach((entry) => {
              if (!entry || typeof entry !== 'object') return
              const date = (entry.date || entry.day || '').trim()
              const allDay = Boolean(entry.all_day ?? entry.allDay)
              const blocks = Array.isArray(entry.blocks) ? entry.blocks : null

              if (allDay) {
                rows.push(
                  createRow({
                    date,
                    all_day: true,
                    start_time: '',
                    end_time: '',
                  }),
                )
                return
              }

              if (blocks && blocks.length) {
                blocks.forEach((block) => {
                  if (!block || typeof block !== 'object') return
                  const startValue = block.start || block.start_time || block.startTime || ''
                  const endValue = block.end || block.end_time || block.endTime || ''
                  rows.push(
                    createRow({
                      date,
                      start_time: typeof startValue === 'string' ? startValue : '',
                      end_time: typeof endValue === 'string' ? endValue : '',
                      all_day: false,
                    }),
                  )
                })
                return
              }

              const startValue = entry.start_time || entry.startTime || ''
              const endValue = entry.end_time || entry.endTime || ''
              rows.push(
                createRow({
                  date,
                  start_time: typeof startValue === 'string' ? startValue : '',
                  end_time: typeof endValue === 'string' ? endValue : '',
                  all_day: false,
                }),
              )
            })

            return rows
          }

          function sortRows(rows) {
            return [...rows].sort((a, b) => {
              const dateA = a.date || ''
              const dateB = b.date || ''
              if (!dateA && !dateB) return 0
              if (!dateA) return 1
              if (!dateB) return -1
              if (dateA !== dateB) return dateA.localeCompare(dateB)
              if (a.all_day && !b.all_day) return -1
              if (!a.all_day && b.all_day) return 1
              const startA = a.start_time || ''
              const startB = b.start_time || ''
              if (startA && startB) return startA.localeCompare(startB)
              if (startA) return -1
              if (startB) return 1
              return 0
            })
          }

          function rowsEqual(a, b) {
            if (a.length !== b.length) return false
            for (let index = 0; index < a.length; index += 1) {
              const first = a[index]
              const second = b[index]
              if (
                first.date !== second.date ||
                first.start_time !== second.start_time ||
                first.end_time !== second.end_time ||
                Boolean(first.all_day) !== Boolean(second.all_day)
              ) {
                return false
              }
            }
            return true
          }

          function rowsToSchedule(rowsInput) {
            const grouped = new Map()

            rowsInput.forEach((row) => {
              if (!row || !row.date) return
              const key = row.date
              if (!grouped.has(key)) {
                grouped.set(key, { date: key, all_day: false, blocks: [] })
              }
              const entry = grouped.get(key)
              if (row.all_day) {
                entry.all_day = true
                entry.blocks = []
                return
              }
              if (entry.all_day) {
                return
              }
              const startValue = (row.start_time || '').trim()
              const endValue = (row.end_time || '').trim()
              if (startValue && endValue) {
                entry.blocks.push({ start: startValue, end: endValue })
              }
            })

            return Array.from(grouped.values())
              .map((entry) => {
                if (entry.all_day) {
                  return { date: entry.date, all_day: true, blocks: [] }
                }
                const blocks = entry.blocks
                  .filter((block) => block.start && block.end)
                  .map((block) => ({ start: block.start, end: block.end }))
                  .sort((a, b) => a.start.localeCompare(b.start))
                return { date: entry.date, all_day: false, blocks }
              })
              .filter((entry) => entry.all_day || entry.blocks.length > 0)
              .sort((a, b) => a.date.localeCompare(b.date))
          }

          function countBlocks(schedule) {
            return schedule.reduce((total, entry) => {
              if (!entry || !Array.isArray(entry.blocks)) return total
              return total + entry.blocks.length
            }, 0)
          }

          function toImmutable(rows) {
            if (Immutable && typeof Immutable.fromJS === 'function') {
              return Immutable.fromJS(rows)
            }
            return rows
          }

          function parseDateInput(value) {
            if (!value) return null
            const trimmed = String(value).trim()
            if (!/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) return null
            const date = new Date(trimmed)
            if (Number.isNaN(date.getTime())) return null
            return new Date(date.getFullYear(), date.getMonth(), date.getDate())
          }

          function formatIsoDate(date) {
            const year = date.getFullYear()
            const month = String(date.getMonth() + 1).padStart(2, '0')
            const day = String(date.getDate()).padStart(2, '0')
            return `${year}-${month}-${day}`
          }

          function DailyScheduleControl(props) {
            const { value, onChange, forID, classNameWrapper } = props
            const initialRows = useMemo(() => sortRows(normalizeRows(value)), [value])
            const [rows, setRows] = useState(initialRows.length ? initialRows : [createRow()])
            const lastLoadedSummaryRef = useRef('')
            const lastSavedSummaryRef = useRef('')

            useEffect(() => {
              const next = sortRows(normalizeRows(value))
              const schedule = rowsToSchedule(next)
              const summaryKey = JSON.stringify(schedule)
              if (summaryKey !== lastLoadedSummaryRef.current) {
                lastLoadedSummaryRef.current = summaryKey
                const dayCount = schedule.length
                const blockCount = countBlocks(schedule)
                console.info(`[cms] events dailySchedule loaded: ${dayCount} day(s), ${blockCount} block(s)`)
              }
              if (!rowsEqual(next, rows)) {
                setRows(next.length ? next : [createRow()])
              }
            }, [value, rows])

            const sanitizedRows = useMemo(() => rowsToSchedule(rows), [rows])

            useEffect(() => {
              if (!onChange) return
              const scheduleJson = JSON.stringify(sanitizedRows)
              if (scheduleJson !== lastSavedSummaryRef.current) {
                lastSavedSummaryRef.current = scheduleJson
                const dayCount = sanitizedRows.length
                const blockCount = countBlocks(sanitizedRows)
                console.info(`[cms] events dailySchedule saved: ${dayCount} day(s), ${blockCount} block(s)`)
              }
              onChange(toImmutable(sanitizedRows))
            }, [onChange, sanitizedRows])

            function updateRow(index, updates) {
              const next = rows.map((row, rowIndex) =>
                rowIndex === index
                  ? {
                      ...row,
                      ...updates,
                    }
                  : row,
              )
              setRows(sortRows(next))
            }

            function handleAddRow() {
              setRows((prev) => sortRows([...prev, createRow()]))
            }

            function handleRemoveRow(index) {
              const next = rows.filter((_, rowIndex) => rowIndex !== index)
              setRows(next.length ? sortRows(next) : [createRow()])
            }

            function handleDuplicateHours(index) {
              if (index <= 0) return
              const source = rows[index - 1]
              if (!source || source.all_day) return
              updateRow(index, {
                start_time: source.start_time,
                end_time: source.end_time,
                all_day: false,
              })
            }

            function handleAddRange() {
              const startInput = promptFn ? promptFn('Start date (YYYY-MM-DD)') : null
              if (!startInput) return
              const endInput = promptFn ? promptFn('End date (YYYY-MM-DD)', startInput) : null
              if (!endInput) return
              const startDate = parseDateInput(startInput)
              const endDate = parseDateInput(endInput)
              if (!startDate || !endDate) {
                if (alertFn) {
                  alertFn('Enter dates in YYYY-MM-DD format (e.g., 2025-11-15).')
                }
                return
              }
              if (endDate < startDate) {
                if (alertFn) {
                  alertFn('End date must be on or after the start date.')
                }
                return
              }
              const existing = new Set(rows.map((row) => row.date).filter(Boolean))
              const additions = []
              for (let cursor = new Date(startDate); cursor <= endDate; cursor.setDate(cursor.getDate() + 1)) {
                const iso = formatIsoDate(cursor)
                if (!existing.has(iso)) {
                  additions.push(createRow({ date: iso }))
                }
              }
              if (!additions.length) {
                if (alertFn) {
                  alertFn('All days in that range are already listed.')
                }
                return
              }
              setRows((prev) => sortRows([...prev, ...additions]))
            }

            return React.createElement(
              'div',
              { id: forID, className: classNameWrapper, style: containerStyle },
              React.createElement(
                'div',
                { style: headerStyle },
                React.createElement('strong', null, 'Daily schedule'),
                React.createElement(
                  'div',
                  { style: actionsStyle },
                  React.createElement(
                    'button',
                    { type: 'button', style: buttonStyle, onClick: handleAddRange },
                    'Add days from range',
                  ),
                  React.createElement(
                    'button',
                    { type: 'button', style: buttonStyle, onClick: handleAddRow },
                    'Add day',
                  ),
                ),
              ),
              rows.map((row, index) => {
                const disableTimes = Boolean(row.all_day)
                return React.createElement(
                  'div',
                  { key: row.id || row.key || `${row.date || 'row'}-${index}`, style: rowStyle },
                  React.createElement(
                    'label',
                    { style: fieldStyle },
                    React.createElement('span', { style: labelStyle }, 'Date'),
                    React.createElement('input', {
                      type: 'date',
                      value: row.date,
                      onChange: (event) => updateRow(index, { date: event.target.value }),
                      style: inputStyle,
                    }),
                  ),
                  React.createElement(
                    'label',
                    { style: fieldStyle },
                    React.createElement('span', { style: labelStyle }, 'Start time'),
                    React.createElement('input', {
                      type: 'time',
                      value: row.start_time,
                      disabled: disableTimes,
                      onChange: (event) => updateRow(index, { start_time: event.target.value }),
                      style: { ...inputStyle, background: disableTimes ? '#e2e8f0' : inputStyle.background },
                    }),
                  ),
                  React.createElement(
                    'label',
                    { style: fieldStyle },
                    React.createElement('span', { style: labelStyle }, 'End time'),
                    React.createElement('input', {
                      type: 'time',
                      value: row.end_time,
                      disabled: disableTimes,
                      onChange: (event) => updateRow(index, { end_time: event.target.value }),
                      style: { ...inputStyle, background: disableTimes ? '#e2e8f0' : inputStyle.background },
                    }),
                  ),
                  React.createElement(
                    'div',
                    { style: checkboxWrapperStyle },
                    React.createElement('input', {
                      type: 'checkbox',
                      checked: Boolean(row.all_day),
                      onChange: (event) =>
                        updateRow(index, {
                          all_day: event.target.checked,
                          ...(event.target.checked ? { start_time: '', end_time: '' } : {}),
                        }),
                    }),
                    React.createElement('span', { style: { fontSize: '13px', fontWeight: 500, color: '#1e293b' } }, 'All day'),
                  ),
                  React.createElement(
                    'div',
                    {
                      style: {
                        display: 'flex',
                        flexWrap: 'wrap',
                        gap: '8px',
                        justifyContent: 'flex-end',
                      },
                    },
                    index > 0 && !disableTimes
                      ? React.createElement(
                          'button',
                          {
                            type: 'button',
                            style: buttonStyle,
                            onClick: () => handleDuplicateHours(index),
                          },
                          'Duplicate previous hours',
                        )
                      : null,
                    React.createElement(
                      'button',
                      {
                        type: 'button',
                        style: destructiveButtonStyle,
                        onClick: () => handleRemoveRow(index),
                      },
                      'Remove',
                    ),
                  ),
                )
              }),
              sanitizedRows.length === 0
                ? React.createElement(
                    'p',
                    { style: { fontSize: '12px', color: '#64748b', marginTop: '-4px' } },
                    'Add at least one day when using the daily schedule.',
                  )
                : null,
            )
          }

          DailyScheduleControl.validate = (
            value,
            opts,
            field,
            fieldsMeta,
            currentValue,
            entry,
          ) => {
            const useDaily = entry?.getIn
              ? entry.getIn(['data', 'use_daily_schedule'])
              : entry?.data?.use_daily_schedule
            const rowCount = value?.size ?? value?.length ?? 0
            const hasRows = Boolean(value) && rowCount > 0
            return useDaily && !hasRows
              ? 'Add at least one day (or mark a day as All day).'
              : true
          }

          try {
            CMS.registerWidget('dailySchedule', DailyScheduleControl)
            dailyScheduleRegisteredWindows.add(targetWindow)
            console.info('[cms] widget registered: dailySchedule')
          } catch (error) {
            console.error('[cms] failed to register dailySchedule widget', error)
          }
        }

        const legacyStylingInitializedFor = new WeakSet()

        function activateLegacyFieldStyling(contextWindow) {
          const targetWindow = contextWindow && contextWindow.document ? contextWindow : window
          const targetDocument = targetWindow.document
          if (!targetDocument) return
          if (legacyStylingInitializedFor.has(targetWindow)) return
          legacyStylingInitializedFor.add(targetWindow)

          const raf =
            typeof targetWindow.requestAnimationFrame === 'function'
              ? targetWindow.requestAnimationFrame.bind(targetWindow)
              : (callback) => targetWindow.setTimeout(callback, 16)

          const ensureStyleElement = () => {
            const styleId = 'ns-legacy-schedule-style'
            if (targetDocument.getElementById(styleId)) return

            const head = targetDocument.head || targetDocument.getElementsByTagName('head')[0]
            if (!head) {
              raf(ensureStyleElement)
              return
            }

            const style = targetDocument.createElement('style')
            style.id = styleId
            style.textContent = `
              [data-field-name="startDate"].ns-legacy-muted,
              [data-field-name="endDate"].ns-legacy-muted {
                opacity: 0.55;
                transition: opacity 0.2s ease-in-out;
              }
              [data-field-name="startDate"].ns-legacy-muted:hover,
              [data-field-name="endDate"].ns-legacy-muted:hover {
                opacity: 0.85;
              }
            `
            head.appendChild(style)
          }

          const update = () => {
            const flag = targetDocument.querySelector(
              '[data-field-name="use_daily_schedule"] input[type="checkbox"]',
            )
            const startField = targetDocument.querySelector('[data-field-name="startDate"]')
            const endField = targetDocument.querySelector('[data-field-name="endDate"]')
            const muted = Boolean(flag && flag.checked)
            ;[startField, endField].forEach((node) => {
              if (!node) return
              if (muted) {
                node.classList.add('ns-legacy-muted')
              } else {
                node.classList.remove('ns-legacy-muted')
              }
            })
          }

          const observer = new targetWindow.MutationObserver(() => {
            raf(update)
          })

          const startObserving = () => {
            if (!targetDocument.body) {
              raf(startObserving)
              return
            }
            observer.observe(targetDocument.body, { childList: true, subtree: true })
          }

          ensureStyleElement()
          startObserving()

          targetDocument.addEventListener('change', (event) => {
            if (event.target && event.target.closest('[data-field-name="use_daily_schedule"]')) {
              raf(update)
            }
          })

          raf(update)
        }

        const headerLayoutFixAppliedFor = new WeakSet()

        function applyCmsHeaderLayoutFix(contextWindow) {
          const targetWindow = contextWindow && contextWindow.document ? contextWindow : window
          const targetDocument = targetWindow.document
          if (!targetDocument) return
          if (headerLayoutFixAppliedFor.has(targetWindow)) return
          headerLayoutFixAppliedFor.add(targetWindow)

          const raf =
            typeof targetWindow.requestAnimationFrame === 'function'
              ? targetWindow.requestAnimationFrame.bind(targetWindow)
              : (callback) => targetWindow.setTimeout(callback, 16)

          const ensureStyleElement = () => {
            const styleId = 'ns-cms-header-layout-fix'
            if (targetDocument.getElementById(styleId)) return

            const head = targetDocument.head || targetDocument.getElementsByTagName('head')[0]
            if (!head) {
              raf(ensureStyleElement)
              return
            }

            const style = targetDocument.createElement('style')
            style.id = styleId
            style.textContent = `
              #nc-root [data-testid="collection-top"],
              #nc-root [class*="CollectionTop_top"] {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
              }
              #nc-root [data-testid="collection-top"] > *:first-child,
              #nc-root [class*="CollectionTop_top"] > *:first-child {
                flex: 1 1 auto;
                min-width: 200px;
              }
              #nc-root [data-testid="collection-top"] [data-testid="collection-actions"],
              #nc-root [class*="CollectionTop_top"] [data-testid="collection-actions"],
              #nc-root [class*="CollectionTop_top"] [class*="CollectionTop_actions"],
              #nc-root [class*="CollectionTop_top"] [class*="CollectionTop_topActions"] {
                margin-left: auto;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
                justify-content: flex-end;
              }
            `
            head.appendChild(style)
          }

          const applyInlineLayout = () => {
            const topContainer =
              targetDocument.querySelector('#nc-root [data-testid="collection-top"]') ||
              targetDocument.querySelector('#nc-root [class*="CollectionTop_top"]')

            if (!topContainer) return

            topContainer.style.display = 'flex'
            topContainer.style.alignItems = 'center'
            topContainer.style.flexWrap = 'wrap'
            topContainer.style.gap = '8px'

            const headingContainer = topContainer.firstElementChild
            if (headingContainer) {
              headingContainer.style.flex = '1 1 auto'
              headingContainer.style.minWidth = '200px'
            }

            const findActionsContainer = () => {
              const directMatch = topContainer.querySelector('[data-testid="collection-actions"]')
              if (directMatch) return directMatch

              const classMatch = topContainer.querySelector(
                '[class*="CollectionTop_actions"], [class*="CollectionTop_topActions"]',
              )
              if (classMatch) return classMatch

              const lastChild = topContainer.lastElementChild
              if (lastChild && lastChild !== headingContainer) {
                return lastChild
              }
              return null
            }

            const actionsContainer = findActionsContainer()
            if (actionsContainer) {
              actionsContainer.style.marginLeft = 'auto'
              actionsContainer.style.display = 'flex'
              actionsContainer.style.alignItems = 'center'
              actionsContainer.style.flexWrap = 'wrap'
              actionsContainer.style.gap = '8px'
              actionsContainer.style.justifyContent = 'flex-end'
              actionsContainer.style.order = '2'
            }
          }

          const startObserving = () => {
            if (!targetDocument.body) {
              raf(startObserving)
              return
            }

            const observer = new targetWindow.MutationObserver(() => {
              raf(applyInlineLayout)
            })

            observer.observe(targetDocument.body, { childList: true, subtree: true })
            raf(applyInlineLayout)
          }

          ensureStyleElement()
          startObserving()
        }

        if (typeof window !== 'undefined') {
          window.registerDailyScheduleWidget = registerDailyScheduleWidget
          window.registerEventsPreview = registerEventsPreview
          window.activateLegacyFieldStyling = activateLegacyFieldStyling
          window.applyCmsHeaderLayoutFix = applyCmsHeaderLayoutFix
        }

        const form = document.getElementById('cms-login-form')
        const statusEl = document.getElementById('login-status')
        const logoutButton = document.getElementById('logout-button')

        const submitButton = form.querySelector("button[type='submit']")
        const defaultButtonText = submitButton.textContent

        function setStatus(message, isError) {
          statusEl.textContent = message || ''
          statusEl.style.color = isError ? '#dc2626' : '#0f172a'
        }

        function setLoading(isLoading) {
          submitButton.disabled = isLoading
          submitButton.textContent = isLoading ? 'Signing in…' : defaultButtonText
        }

        function clearStoredTokens() {
          try {
            STORAGE_KEYS.forEach((key) => localStorage.removeItem(key))
          } catch (error) {
            console.warn('[cms-login] failed to clear stored tokens', error)
          }
        }

        function storeToken(token, username) {
          try {
            const safeName =
              typeof username === 'string' && username.trim()
                ? username.trim()
                : 'CMS User'
            const payload = JSON.stringify({
              token,
              backendName: 'github',
              login: safeName,
              name: safeName,
            })
            STORAGE_KEYS.forEach((key) => localStorage.setItem(key, payload))
          } catch (error) {
            console.warn('[cms-login] failed to store token', error)
          }
        }

        function getStoredUser() {
          try {
            for (const key of STORAGE_KEYS) {
              const raw = localStorage.getItem(key)
              if (!raw) continue
              try {
                const value = JSON.parse(raw)
                if (
                  value &&
                  typeof value === 'object' &&
                  typeof value.token === 'string' &&
                  value.token.length
                ) {
                  return value
                }
              } catch (error) {
                localStorage.removeItem(key)
              }
            }
          } catch (error) {
            console.warn('[cms-login] failed to access stored token', error)
          }
          return null
        }

        function loadScript(src) {
          return new Promise((resolve, reject) => {
            const script = document.createElement('script')
            script.src = src
            script.async = true
            script.onload = () => resolve(src)
            script.onerror = () => {
              script.remove()
              reject(new Error(`Failed to load CMS script: ${src}`))
            }
            document.body.appendChild(script)
          })
        }

        async function loadCMSInterface(fromLogin = false) {
          if (window.__cmsLoaded) {
            await ensureCmsEnhancementsReady()
            if (fromLogin) setLoading(false)
            return true
          }

          const storedUser = getStoredUser()
          if (!storedUser) {
            if (fromLogin) {
              setStatus('Login response is missing an access token.', true)
              setLoading(false)
            }
            return false
          }

          window.__cmsLoaded = true
          document.body.classList.add('cms-loaded')
          setStatus('', false)

          if (!window.location.hash || window.location.hash === '#') {
            window.location.replace('#/collections/collections')
          }

          for (const src of CMS_SCRIPT_URLS) {
            try {
              await loadScript(src)
              await ensureCmsEnhancementsReady()
              if (fromLogin) setLoading(false)
              return true
            } catch (error) {
              console.warn('[cms-login] failed to load script', src, error)
            }
          }

          window.__cmsLoaded = false
          document.body.classList.remove('cms-loaded')
          setStatus('Failed to load the CMS interface. Please try again.', true)
          if (fromLogin) setLoading(false)
          clearStoredTokens()
          return false
        }

        async function handleLogin(event) {
          event.preventDefault()

          const formData = new FormData(form)
          const username = (formData.get('username') || '').trim()
          const password = formData.get('password') || ''

          if (!username || !password) {
            setStatus('Enter both your username and password.', true)
            return
          }

          setLoading(true)
          setStatus('Signing in…', false)

          try {
            const response = await fetch('/api/cms-login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password }),
              credentials: 'same-origin',
            })

            const payload = await response.json().catch(() => ({}))

            if (!response.ok) {
              const message =
                typeof payload.error === 'string'
                  ? payload.error
                  : 'Login failed. Please check your credentials.'
              setStatus(message, true)
              if (response.status === 401) {
                clearStoredTokens()
              }
              setLoading(false)
              return
            }

            if (!payload.token || typeof payload.token !== 'string') {
              clearStoredTokens()
              setStatus('Login response is missing an access token.', true)
              setLoading(false)
              return
            }

            storeToken(payload.token, username)
            setStatus('Signed in! Loading the CMS…', false)
            await loadCMSInterface(true)
          } catch (error) {
            console.error('[cms-login] request failed', error)
            setStatus('We could not reach the server. Please try again.', true)
            setLoading(false)
          }
        }

        function handleLogout() {
          clearStoredTokens()
          window.location.replace('/cms/')
        }

        form.addEventListener('submit', handleLogin)
        logoutButton.addEventListener('click', handleLogout)

        const existingUser = getStoredUser()
        if (existingUser) {
          loadCMSInterface()
        } else {
          window.requestAnimationFrame(() => {
            const usernameInput = document.getElementById('username')
            if (usernameInput) {
              try {
                usernameInput.focus()
              } catch (error) {
                console.warn('[cms-login] failed to focus username input', error)
              }
            }
          })
        }
      })()
    </script>
  </body>
</html>
