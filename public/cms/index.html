<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NorthSide GTA CMS</title>
  </head>
  <body>
    <!-- 1) Load Decap -->
    <script src="https://unpkg.com/decap-cms@^3.8.3/dist/decap-cms.js"></script>

    <!-- 2) Handshake shim: if a token is already stored, simulate popup success -->
    <script>
      ;(function replayGithubAuthIfNeeded() {
        try {
          var raw =
            localStorage.getItem('decap-cms-user') ||
            localStorage.getItem('netlify-cms-user')
          if (!raw) return

          var user = JSON.parse(raw)
          if (!user || !user.token) return

          // Send both legacy and JSON messages that Decap listens for
          // Do it on a short delay to ensure Decap's listeners are ready
          setTimeout(function () {
            try {
              window.postMessage('authorizing:github', '*')
            } catch (e) {}
            try {
              window.postMessage(
                'authorization:github:success:' + user.token,
                '*'
              )
            } catch (e) {}
            try {
              window.postMessage(
                JSON.stringify({ token: user.token, provider: 'github' }),
                '*'
              )
            } catch (e) {}
          }, 50)
        } catch (e) {
          // ignore
        }
      })()
    </script>
  </body>
</html>
