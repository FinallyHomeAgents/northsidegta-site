<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Events Admin</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial, sans-serif;
        color: #0f172a;
      }

      .daily-schedule-widget h4 {
        font-size: 16px;
        margin-bottom: 10px;
      }

      .daily-schedule-widget .day-block {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        padding: 10px;
        margin-bottom: 10px;
      }

      .daily-schedule-widget button {
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 6px 12px;
        cursor: pointer;
      }

      .daily-schedule-widget button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>

  <body>
    <script type="module">
      const CMS_SCRIPT_URL = "https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js";

      async function initCMS() {
        // Load Decap
        await import(CMS_SCRIPT_URL);
        const { CMS } = window;

        // Initialize CMS manually since we use CMS_MANUAL_INIT
        CMS.init();
        console.log("[cms] Decap CMS initialized manually");

        // Wait until React + CMS are ready
        const waitForReact = async () => {
          for (let i = 0; i < 60; i++) {
            if (CMS.imports?.React) return CMS.imports.React;
            await new Promise((r) => setTimeout(r, 100));
          }
          console.warn("[cms] React never appeared, importing manually");
          await import("https://unpkg.com/react@18.2.0/umd/react.production.min.js");
          return window.React;
        };

        const React = await waitForReact();
        const { useState } = React;

        // Define custom widget
        function DailyScheduleControl({ value = [], onChange }) {
          const [days, setDays] = useState(value || []);

          const addDay = () => {
            const next = [...days, { date: "", start: "", end: "", allDay: false }];
            setDays(next);
            onChange(next);
          };

          const updateDay = (i, field, val) => {
            const updated = days.map((d, idx) => (idx === i ? { ...d, [field]: val } : d));
            setDays(updated);
            onChange(updated);
          };

          const removeDay = (i) => {
            const updated = days.filter((_, idx) => idx !== i);
            setDays(updated);
            onChange(updated);
          };

          return React.createElement(
            "div",
            { className: "daily-schedule-widget" },
            [
              React.createElement("h4", { key: "title" }, "Daily Schedule"),
              ...days.map((day, i) =>
                React.createElement(
                  "div",
                  { key: i, className: "day-block" },
                  [
                    React.createElement("input", {
                      key: "date",
                      type: "date",
                      value: day.date,
                      onChange: (e) => updateDay(i, "date", e.target.value),
                      style: { display: "block", marginBottom: "8px", width: "100%" },
                    }),
                    React.createElement(
                      "div",
                      { key: "time-row", style: { display: "flex", gap: "8px" } },
                      [
                        React.createElement("input", {
                          key: "start",
                          type: "time",
                          value: day.start,
                          onChange: (e) => updateDay(i, "start", e.target.value),
                          style: { flex: 1 },
                        }),
                        React.createElement("input", {
                          key: "end",
                          type: "time",
                          value: day.end,
                          onChange: (e) => updateDay(i, "end", e.target.value),
                          style: { flex: 1 },
                        }),
                        React.createElement(
                          "label",
                          { key: "allday", style: { display: "flex", alignItems: "center", gap: "4px" } },
                          [
                            React.createElement("input", {
                              type: "checkbox",
                              checked: day.allDay,
                              onChange: (e) => updateDay(i, "allDay", e.target.checked),
                            }),
                            "All Day",
                          ]
                        ),
                      ]
                    ),
                    React.createElement(
                      "button",
                      {
                        key: "remove",
                        type: "button",
                        onClick: () => removeDay(i),
                        style: { background: "#ef4444", marginTop: "8px" },
                      },
                      "Remove Day"
                    ),
                  ]
                )
              ),
              React.createElement(
                "button",
                { key: "add", type: "button", onClick: addDay, style: { marginTop: "10px" } },
                "Add Another Day"
              ),
            ]
          );
        }

        function DailySchedulePreview({ value }) {
          return React.createElement(
            "pre",
            { style: { background: "#f1f5f9", padding: "10px", borderRadius: "6px" } },
            JSON.stringify(value, null, 2)
          );
        }

        CMS.registerWidget("dailySchedule", DailyScheduleControl, DailySchedulePreview);
        console.log("[dailySchedule] Widget registered successfully ✅");
      }

      initCMS().catch((err) => console.error("[cms] init error:", err));
    </script>
  </body>
</html>
