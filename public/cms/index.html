<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NorthSide GTA CMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body,
      #nc-root {
        height: 100%;
        margin: 0;
      }
    </style>
    <!-- IMPORTANT: do NOT set window.CMS_MANUAL_INIT; let Decap auto-init -->
  </head>
  <body>
    <div id="nc-root"></div>

    <!-- 1) Load a stable Decap version -->
    <script src="https://unpkg.com/decap-cms@3.6.2/dist/decap-cms.js"></script>

    <!-- 2) Inline config (loaded before/with CMS so it uses this) -->
    <script>
      window.CMS_CONFIG = {
        backend: {
          name: 'github',
          repo: 'FinallyHomeAgents/northsidegta-site',
          branch: 'main',
          base_url: 'https://northsidegta.ca',
          auth_endpoint: '/api/oauth/start',
        },
        media_folder: 'public/uploads',
        public_folder: '/uploads',
        collections: [
          {
            name: 'collections',
            label: 'Curated Collections',
            folder: 'public/data/collections',
            create: true,
            extension: 'json',
            format: 'json',
            identifier_field: 'slug',
            slug: '{{slug}}',
            fields: [
              { name: 'title', label: 'Page Title' },
              {
                name: 'slug',
                label: 'Slug (URL part)',
                widget: 'string',
                pattern: [
                  '^[a-z0-9-]+$',
                  'Use lowercase letters, numbers, and dashes only',
                ],
              },
              { name: 'intro', label: 'Intro (optional)', required: false },
              { name: 'realmLink', label: 'Realm Link (the private URL)' },
              {
                name: 'heroImage',
                label: 'Hero Image',
                widget: 'image',
                required: false,
              },
            ],
          },
        ],
      }
    </script>

    <!-- 3) Token re-broadcast loop (covers timing/race issues) -->
    <script>
      ;(function replayToken() {
        function pump() {
          try {
            const raw =
              localStorage.getItem('decap-cms-user') ||
              localStorage.getItem('netlify-cms-user')
            if (raw) {
              const u = JSON.parse(raw)
              if (u && u.token) {
                // New JSON and legacy formats
                window.postMessage(
                  JSON.stringify({ token: u.token, provider: 'github' }),
                  '*'
                )
                window.postMessage(
                  'authorization:github:success:' + u.token,
                  '*'
                )
                // If we're on the login/landing, navigate to Collections
                if (
                  !location.hash ||
                  location.hash === '#/' ||
                  location.hash === '#/login'
                ) {
                  location.hash = '#/collections/collections'
                }
              }
            }
          } catch (_) {}
        }
        // Run for ~12 seconds to cover slow listeners
        let n = 0
        const id = setInterval(() => {
          pump()
          if (++n > 100) clearInterval(id)
        }, 120)
        window.addEventListener('load', pump, { once: true })
      })()
    </script>
  </body>
</html>
