<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NorthSide GTA CMS</title>
    <style>
      html,
      body,
      #nc-root {
        height: 100%;
        margin: 0;
      }
    </style>
    <script>
      window.CMS_MANUAL_INIT = true
    </script>
  </head>
  <body>
    <div id="nc-root"></div>

    <!-- Decap (stable) -->
    <script src="https://unpkg.com/decap-cms@3.5.0/dist/decap-cms.js"></script>

    <script>
      ;(function () {
        function log() {
          try {
            console.log.apply(console, arguments)
          } catch (e) {}
        }
        function boot() {
          if (!window.CMS || !CMS.init) return setTimeout(boot, 50)

          log('[cms] CMS detected; starting init with /cms/config.yml')

          try {
            CMS.init({ config: '/cms/config.yml' })
            window.__cmsInited = true // <-- set flag AFTER init call
            log('[cms] CMS.init() called')
          } catch (e) {
            window.__cmsErr = e
            console.error('[cms] CMS.init() error:', e)
            return // don't proceed if init threw
          }

          // If a token is already stored, replay JSON so auth listener fires
          try {
            var raw =
              localStorage.getItem('decap-cms-user') ||
              localStorage.getItem('netlify-cms-user')
            if (raw) {
              var u = JSON.parse(raw)
              if (u && u.token) {
                setTimeout(function () {
                  try {
                    window.postMessage(
                      JSON.stringify({ token: u.token, provider: 'github' }),
                      '*'
                    )
                    log('[cms] replayed token to window.postMessage')
                  } catch (e) {
                    console.error('[cms] postMessage error:', e)
                  }
                  if (
                    !location.hash ||
                    location.hash === '#/' ||
                    location.hash === '#'
                  ) {
                    location.hash = '#/collections/collections'
                  }
                }, 150)
              }
            }
          } catch (e) {
            console.error('[cms] token replay error:', e)
          }
        }
        boot()
      })()
    </script>
  </body>
</html>
