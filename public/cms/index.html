<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NorthSide GTA CMS</title>
  </head>
  <body>
    <!-- Pin to a stable build -->
    <script src="https://unpkg.com/decap-cms@3.5.0/dist/decap-cms.js"></script>

    <script>
      // If token already in storage, replay ONLY the JSON message and route to collections
      ;(function () {
        try {
          var raw =
            localStorage.getItem('decap-cms-user') ||
            localStorage.getItem('netlify-cms-user')
          if (!raw) return
          var u = JSON.parse(raw)
          if (!u || !u.token) return

          setTimeout(function () {
            try {
              window.postMessage(
                JSON.stringify({ token: u.token, provider: 'github' }),
                '*'
              )
            } catch (e) {}
            if (
              !location.hash ||
              location.hash === '#/' ||
              location.hash === '#'
            ) {
              location.hash = '#/collections/collections'
            }
          }, 50)
        } catch (e) {}
      })()
    </script>
  </body>
</html>
