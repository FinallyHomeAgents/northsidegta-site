<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NorthSide GTA CMS</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body{
        margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background: linear-gradient(135deg,#0f172a,#1e293b);
        font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif;
        color:#0f172a;
      }
      body.cms-loaded { display:block; background:#f8fafc; }
      /* top-right controls */
      #cms-controls{position:fixed;top:16px;right:16px;z-index:1000;display:none}
      body.cms-loaded #cms-controls{display:block}
      #events-admin-link{
        margin-right:12px;padding:8px 16px;border-radius:999px;background:rgba(37,99,235,.12);
        color:#1d4ed8;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;gap:6px
      }
      #logout-button{padding:8px 14px;border-radius:999px;border:none;background:#0f172a;color:#f8fafc;font-size:13px;font-weight:600;cursor:pointer}

      /* login card */
      #login-container{
        width:min(90%,420px);background:rgba(255,255,255,.96);border-radius:18px;padding:28px;
        box-shadow:0 25px 70px rgba(15,23,42,.35);backdrop-filter:blur(12px);display:none
      }
      body.show-login #login-container{display:block}
      h1{margin:0 0 16px;font-size:24px;font-weight:600;text-align:center;color:#0f172a}
      p.description{margin:0 16px 20px;font-size:15px;color:#475569;text-align:center}
      label{display:block;margin-bottom:14px}
      label span{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:#1e293b}
      input[type='text'],input[type='password']{
        width:100%;padding:12px 14px;border-radius:10px;border:1px solid #cbd5f5;background:#f8fafc;font-size:14px
      }
      button[type='submit']{
        width:100%;padding:12px 16px;border:none;border-radius:999px;background:#2563eb;color:#fff;font-weight:600;font-size:15px;cursor:pointer;margin-top:6px
      }
      #login-status{min-height:20px;margin-top:12px;font-size:13px;text-align:center;color:#dc2626}
      .alt-login{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
      .alt-btn{border-radius:999px;border:1px solid #cbd5f5;background:#f8fafc;color:#1e3a8a;font-size:13px;font-weight:600;padding:8px 12px;cursor:pointer}
    </style>

    <!-- Tell Decap we’ll init manually -->
    <script>window.CMS_MANUAL_INIT = true;</script>
    <!-- Single CDN bundle -->
    <script src="https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js"></script>
  </head>
  <body>
    <div id="cms-controls">
      <a id="events-admin-link" href="/community/events-admin" target="_blank" rel="noopener noreferrer">Community Events Admin</a>
      <button id="logout-button" type="button">Log out</button>
    </div>

    <div id="login-container">
      <form id="cms-login-form" autocomplete="on">
        <h1>Welcome back</h1>
        <p class="description">Sign in to manage your NorthSide GTA content.</p>
        <label>
          <span>Username</span>
          <input type="text" name="username" id="username" autocomplete="username" required />
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" id="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign in</button>
        <div id="login-status" role="status" aria-live="polite"></div>
        <div class="alt-login">
          <button type="button" id="open-github" class="alt-btn" title="Use GitHub OAuth instead">Open CMS with GitHub instead</button>
        </div>
      </form>
    </div>

    <script>
      (function () {
        // ---------------- helpers ----------------
        const STORAGE_KEYS = ['decap-cms-user','netlify-cms-user'];
        const $ = (s)=>document.querySelector(s);
        const params = new URLSearchParams(location.search);

        function setStatus(msg,isErr){ const el=$('#login-status'); if(!el) return; el.textContent=msg||''; el.style.color=isErr?'#dc2626':'#0f172a'; }
        function setLoading(on){ const b=$("#cms-login-form button[type='submit']"); if(!b) return; b.disabled=on; b.textContent=on?'Signing in…':'Sign in'; }
        function clearStoredTokens(){
          try{
            STORAGE_KEYS.forEach(k=>localStorage.removeItem(k));
            localStorage.removeItem('git-gateway-user');
            sessionStorage.clear();
          }catch{}
        }
        function storeToken(token, username){
          try{
            const name = (typeof username==='string' && username.trim()) ? username.trim() : 'CMS User';
            const payload = JSON.stringify({ token, backendName:'github', login:name, name });
            STORAGE_KEYS.forEach(k=>localStorage.setItem(k,payload));
          }catch{}
        }
        function getStoredUser(){
          try{
            for(const k of STORAGE_KEYS){
              const raw = localStorage.getItem(k); if(!raw) continue;
              try{ const v=JSON.parse(raw); if(v && typeof v.token==='string' && v.token.length) return v; }
              catch{ localStorage.removeItem(k); }
            }
          }catch{}
          return null;
        }

        // --------------- dailySchedule (no React hooks) ---------------
        function registerDailyScheduleWidget() {
          // From the CDN build, these are globals:
          const h = window.h || (window.CMS && CMS.h);
          const createClass = window.createClass || (window.CMS && CMS.createClass);
          const Immutable = window.Immutable || (window.CMS && (CMS.Immutable || CMS.imports && CMS.imports.Immutable));
          if (!h || !createClass) {
            console.error('[cms] h/createClass not available yet');
            return;
          }
          const toJS = (v)=> (v && typeof v.toJS==='function') ? v.toJS() : v;
          const fromJS = (v)=> (Immutable && typeof Immutable.fromJS==='function') ? Immutable.fromJS(v) : v;

          function normalize(value) {
            const raw = Array.isArray(value) ? value : Array.isArray(toJS(value)) ? toJS(value) : [];
            return raw.map((r)=>({
              date: (r?.date || '').trim(),
              all_day: !!(r?.all_day || r?.allDay),
              blocks: Array.isArray(r?.blocks) ? r.blocks.map(b=>({start:b?.start||b?.start_time||'', end:b?.end||b?.end_time||''})) : []
            })).filter(r=>r.date || r.blocks?.length || r.all_day);
          }

          const DailyScheduleControl = createClass({
            getInitialState() {
              const n = normalize(this.props.value);
              return { rows: n.length ? n : [{date:'', all_day:false, blocks:[]}] };
            },
            componentDidUpdate(prevProps, prevState) {
              // Sync external value -> state
              if (this.props.value !== prevProps.value) {
                const n = normalize(this.props.value);
                const same = JSON.stringify(n) === JSON.stringify(this.state.rows);
                if (!same) this.setState({ rows: n.length ? n : [{date:'', all_day:false, blocks:[]}] });
              }
              // Push state -> external
              if (this.state !== prevState) {
                const schedule = this.state.rows
                  .map(r=>{
                    if (!r.date) return null;
                    if (r.all_day) return { date:r.date, all_day:true, blocks:[] };
                    const blocks=(r.blocks||[]).filter(b=>b.start && b.end).sort((a,b)=>a.start.localeCompare(b.start));
                    return { date:r.date, all_day:false, blocks };
                  })
                  .filter(Boolean)
                  .sort((a,b)=>a.date.localeCompare(b.date));
                this.props.onChange && this.props.onChange(fromJS(schedule));
              }
            },
            // helpers
            enabled() {
              try {
                return !!(this.props.entry?.getIn?.(['data','use_daily_schedule']) || this.props.entry?.data?.use_daily_schedule);
              } catch { return false; }
            },
            addDay() {
              this.setState({ rows: [...this.state.rows, {date:'', all_day:false, blocks:[]}] });
            },
            rmDay(i) {
              const rows = this.state.rows.filter((_,idx)=>idx!==i);
              this.setState({ rows: rows.length?rows:[{date:'',all_day:false,blocks:[]}] });
            },
            setRow(i, patch) {
              const rows = this.state.rows.map((r,idx)=> idx===i ? Object.assign({}, r, patch) : r);
              this.setState({ rows });
            },
            addBlock(i) {
              const rows = this.state.rows.slice();
              rows[i] = Object.assign({}, rows[i], { blocks: [...(rows[i].blocks||[]), {start:'',end:''}]});
              this.setState({ rows });
            },
            rmBlock(i,j) {
              const rows = this.state.rows.slice();
              rows[i] = Object.assign({}, rows[i], { blocks: (rows[i].blocks||[]).filter((_,k)=>k!==j) });
              this.setState({ rows });
            },
            renderSummary(rows){
              const items = rows.map((r,idx)=>{
                if (!r.date) return h('li',{key:'s'+idx}, 'Unspecified day');
                if (r.all_day) return h('li',{key:'s'+idx}, `${r.date}: All day`);
                const times=(r.blocks||[]).map(b=> (b.start && b.end) ? `${b.start} – ${b.end}` : '').filter(Boolean).join(', ');
                return h('li',{key:'s'+idx}, `${r.date}: ${times || 'Times TBA'}`);
              });
              return h('ul',{style:{margin:'10px 0 0',paddingLeft:'20px'}}, items);
            },
            render() {
              const s={
                wrap:{border:'1px solid #e2e8f0',borderRadius:'14px',padding:'16px',background:'#fff',display:'flex',flexDirection:'column',gap:'12px'},
                top:{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'8px'},
                btn:{borderRadius:'999px',border:'1px solid #cbd5f5',background:'#f8fafc',color:'#1e3a8a',fontSize:'12px',fontWeight:600,padding:'6px 12px',cursor:'pointer'},
                btnDanger:{borderRadius:'999px',border:'1px solid #fecaca',background:'#fef2f2',color:'#b91c1c',fontSize:'12px',fontWeight:600,padding:'6px 12px',cursor:'pointer'},
                row:{border:'1px solid #e2e8f0',borderRadius:'12px',padding:'12px',display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:'12px',alignItems:'end'},
                fld:{display:'flex',flexDirection:'column',gap:'4px'}, lab:{fontSize:'12px',fontWeight:600,letterSpacing:'.04em',textTransform:'uppercase',color:'#475569'},
                input:{borderRadius:'10px',border:'1px solid #cbd5f5',padding:'8px 10px',fontSize:'14px',background:'#f8fafc'}
              };
              const enabled = this.enabled();
              const rows = this.state.rows;

              return h('div',{id:this.props.forID,className:this.props.classNameWrapper,style:s.wrap},
                h('div',{style:s.top},
                  h('strong',null,'Daily schedule'),
                  enabled
                    ? h('button',{type:'button',style:s.btn,onClick:this.addDay},'Add day')
                    : h('div',{style:{fontSize:12,color:'#64748b'}},'Toggle “Enable Daily Schedule” above to edit.')
                ),
                enabled
                  ? rows.map((r,i)=> h('div',{key:i,style:s.row},
                      h('label',{style:s.fld},
                        h('span',{style:s.lab},'Date'),
                        h('input',{type:'date',style:s.input,value:r.date,onChange:(e)=>this.setRow(i,{date:e.target.value})})
                      ),
                      h('label',{style:s.fld},
                        h('span',{style:s.lab},'All day'),
                        h('input',{type:'checkbox',checked:!!r.all_day,onChange:(e)=>this.setRow(i,{all_day:e.target.checked,blocks:e.target.checked?[]:r.blocks})})
                      ),
                      !r.all_day && h('div',{style:{gridColumn:'1 / -1'}},
                        (r.blocks||[]).map((b,j)=> h('div',{key:j,style:{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:12,marginTop:8}},
                          h('label',{style:s.fld},
                            h('span',{style:s.lab},'Start'),
                            h('input',{type:'time',style:s.input,value:b.start,onChange:(e)=>{
                              const blocks=[...(r.blocks||[])]; blocks[j]=Object.assign({},blocks[j],{start:e.target.value}); this.setRow(i,{blocks});
                            }})
                          ),
                          h('label',{style:s.fld},
                            h('span',{style:s.lab},'End'),
                            h('input',{type:'time',style:s.input,value:b.end,onChange:(e)=>{
                              const blocks=[...(r.blocks||[])]; blocks[j]=Object.assign({},blocks[j],{end:e.target.value}); this.setRow(i,{blocks});
                            }})
                          ),
                          h('button',{type:'button',style:s.btnDanger,onClick:()=>this.rmBlock(i,j)},'Remove')
                        )),
                        h('button',{type:'button',style:Object.assign({},s.btn,{marginTop:8}),onClick:()=>this.addBlock(i)},'Add time block')
                      ),
                      h('div',{style:{display:'flex',justifyContent:'flex-end'}},
                        h('button',{type:'button',style:s.btnDanger,onClick:()=>this.rmDay(i)},'Remove day')
                      )
                    ))
                  : h('div',{style:{border:'1px dashed #cbd5f5',borderRadius:'12px',padding:'12px',background:'#f8fafc',color:'#475569',fontSize:'14px'}},
                      rows.length ? this.renderSummary(rows)
                                  : h('p',{style:{margin:0}},'No schedule rows saved yet.')
                    )
              );
            }
          });

          // Validation: if toggle on, require at least one row
          DailyScheduleControl.validate = function(value, opts, field, fieldsMeta, currentValue, entry) {
            let on = false;
            try { on = !!(entry?.getIn?.(['data','use_daily_schedule']) || entry?.data?.use_daily_schedule); } catch {}
            const count = (value && typeof value.size === 'number') ? value.size : (Array.isArray(value) ? value.length : 0);
            return (on && count === 0) ? 'Add at least one day (or mark a day as All day).' : true;
          };

          CMS.registerWidget('dailySchedule', DailyScheduleControl);
          console.info('[cms] dailySchedule registered (createClass/h)');
        }

        // --------------- init CMS after login ---------------
        function startCMS() {
          registerDailyScheduleWidget();
          CMS.init({ configPath: '/config.yml' });
          document.body.classList.add('cms-loaded');
          document.body.classList.remove('show-login');
        }

        // --------------- login & routing ---------------
        if (params.get('logout')) { clearStoredTokens(); location.replace('/cms/?local=1'); return; }
        $('#logout-button')?.addEventListener('click', ()=>{ clearStoredTokens(); location.replace('/cms/?local=1'); });

        $('#open-github')?.addEventListener('click', ()=>{ startCMS(); });

        $('#cms-login-form')?.addEventListener('submit', async (e)=>{
          e.preventDefault();
          const fd = new FormData(e.currentTarget);
          const username = (fd.get('username')||'').trim();
          const password = fd.get('password')||'';
          if(!username || !password){ setStatus('Enter both your username and password.', true); return; }
          setLoading(true); setStatus('Signing in…',false);
          try{
            const res = await fetch('/api/cms-login',{ method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ username, password }), credentials:'same-origin' });
            const payload = await res.json().catch(()=>({}));
            if(!res.ok || !payload.token){
              clearStoredTokens(); setStatus(payload.error || 'Login failed. Please check your credentials.', true); setLoading(false); return;
            }
            storeToken(payload.token, username);
            setStatus('Signed in! Loading the CMS…', false);
            setLoading(false);
            startCMS();
          }catch(err){
            console.error('[cms-login] request failed', err);
            setStatus('We could not reach the server. Please try again.', true);
            setLoading(false);
          }
        });

        // auto-route
        if (getStoredUser()) {
          startCMS();
        } else {
          document.body.classList.add('show-login');
          setTimeout(()=>{ try{ $('#username')?.focus(); }catch{} }, 0);
        }
      })();
    </script>
  </body>
</html>
