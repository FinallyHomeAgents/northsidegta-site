<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NorthSide GTA CMS</title>
    <meta name="robots" content="noindex" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
      }
      .wrap {
        height: 100%;
        display: grid;
        place-items: center;
      }
      .card {
        text-align: center;
        max-width: 560px;
        padding: 24px 28px;
        border: 1px solid #e6e6e6;
        border-radius: 12px;
      }
      .btn {
        display: inline-block;
        padding: 10px 14px;
        font-weight: 700;
        text-decoration: none;
        border-radius: 8px;
        border: 0;
      }
      .btn-primary {
        background: #0b6e4f;
        color: #fff;
      }
      .muted {
        color: #666;
        font-size: 12px;
        margin-top: 10px;
      }
      #nc-root {
        display: none;
        height: 100%;
      }
    </style>
    <script>
      // We will initialize CMS manually after we see a token.
      window.CMS_MANUAL_INIT = true
      // Inline config so we don't depend on Decap fetching config before auth.
      window.CMS_CONFIG = {
        backend: {
          name: 'github',
          repo: 'FinallyHomeAgents/northsidegta-site',
          branch: 'main',
          base_url: 'https://northsidegta.ca',
          auth_endpoint: '/api/oauth/start',
        },
        media_folder: 'public/uploads',
        public_folder: '/uploads',
        collections: [
          {
            name: 'collections',
            label: 'Curated Collections',
            folder: 'public/data/collections',
            create: true,
            extension: 'json',
            format: 'json',
            identifier_field: 'slug',
            slug: '{{slug}}',
            fields: [
              { name: 'title', label: 'Page Title' },
              {
                name: 'slug',
                label: 'Slug (URL part)',
                widget: 'string',
                pattern: [
                  '^[a-z0-9-]+$',
                  'Use lowercase letters, numbers, and dashes only',
                ],
              },
              { name: 'intro', label: 'Intro (optional)', required: false },
              { name: 'realmLink', label: 'Realm Link (the private URL)' },
              {
                name: 'heroImage',
                label: 'Hero Image',
                widget: 'image',
                required: false,
              },
            ],
          },
        ],
      }
    </script>
    <!-- Try two CDNs; fall back to the stable 3.6.x that has getConfig -->
    <script>
      ;(async function loadDecap() {
        const tries = [
          'https://unpkg.com/decap-cms@3.6.2/dist/decap-cms.js',
          'https://cdn.jsdelivr.net/npm/decap-cms@3.6.2/dist/decap-cms.js',
        ]
        let ok = false
        for (const src of tries) {
          try {
            await new Promise((res, rej) => {
              const s = document.createElement('script')
              s.src = src
              s.onload = res
              s.onerror = rej
              document.head.appendChild(s)
            })
            console.log('[cms] loaded:', src)
            ok = true
            break
          } catch (e) {
            console.warn('[cms] failed:', src)
          }
        }
        if (!ok) document.body.dataset.loadError = 'true'
      })()
    </script>
  </head>
  <body>
    <!-- Our minimal pre-login UI -->
    <div class="wrap" id="prelogin">
      <div class="card">
        <h2>NorthSide GTA CMS</h2>
        <p id="status">Sign in to continue.</p>
        <p>
          <!-- Open as a TAB to avoid popup blockers -->
          <a
            class="btn btn-primary"
            id="loginLink"
            href="/api/oauth/start"
            target="_blank"
            rel="noopener"
            >Sign in with GitHub</a
          >
        </p>
        <p class="muted">
          If nothing happens, the login opened in a new tab. Approve on GitHub,
          then return here.
        </p>
      </div>
    </div>

    <!-- Decap will take over this container AFTER auth -->
    <div id="nc-root"></div>

    <script>
      // Helper to read either key; some builds use the legacy key.
      function readToken() {
        const raw =
          localStorage.getItem('decap-cms-user') ||
          localStorage.getItem('netlify-cms-user')
        try {
          return raw ? JSON.parse(raw) : null
        } catch {
          return null
        }
      }

      // Once we have a token, initialize Decap and hide the prelogin card.
      function bootCMS() {
        if (!window.CMS || !CMS.init) return false
        const user = readToken()
        if (!user || !user.token) return false

        // Mirror to both keys to be safe
        localStorage.setItem('decap-cms-user', JSON.stringify(user))
        localStorage.setItem('netlify-cms-user', JSON.stringify(user))

        document.getElementById('prelogin').style.display = 'none'
        document.getElementById('nc-root').style.display = 'block'

        CMS.init({ config: window.CMS_CONFIG })
        console.log('[cms] CMS.init called')
        return true
      }

      // Poll for token for a few seconds after clicking login or coming back from GitHub
      ;(function waitForAuth() {
        const start = Date.now()
        const tick = setInterval(() => {
          if (bootCMS()) {
            clearInterval(tick)
            return
          }
          if (Date.now() - start > 15000) {
            clearInterval(tick)
          }
        }, 350)
      })()

      // If login link is clicked, update status text so user knows what to expect
      document.getElementById('loginLink').addEventListener('click', () => {
        const s = document.getElementById('status')
        s.textContent =
          'Waiting for GitHub authorization… switch to the new tab, approve, then return here.'
        // Start an extra short poll burst
        const t0 = Date.now()
        const poll = setInterval(() => {
          if (bootCMS()) {
            clearInterval(poll)
          }
          if (Date.now() - t0 > 20000) clearInterval(poll)
        }, 300)
      })

      // If a service worker was previously caching the old admin, nuke it.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then((rs) => rs.forEach((r) => r.unregister()))
      }
    </script>
  </body>
</html>
