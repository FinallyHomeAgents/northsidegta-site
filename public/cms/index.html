<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NorthSide GTA CMS</title>
    <style>
      html,
      body,
      #nc-root {
        height: 100%;
        margin: 0;
      }
    </style>

    <!-- IMPORTANT: prevent auto init (avoids double-initialization crash) -->
    <script>
      window.CMS_MANUAL_INIT = true
    </script>
  </head>
  <body>
    <div id="nc-root"></div>

    <!-- Stable Decap build -->
    <script src="https://unpkg.com/decap-cms@3.5.0/dist/decap-cms.js"></script>

    <script>
      ;(function () {
        function once(fn) {
          let ran = false
          return function () {
            if (!ran) {
              ran = true
              try {
                fn()
              } catch (e) {}
            }
          }
        }
        const start = once(function () {
          if (!window.CMS || !CMS.init) return

          // Initialize Decap ONCE and point to the cms config
          CMS.init({ config: '/cms/config.yml' })

          // If we already have a token (from callback), replay JSON message & go to list view
          try {
            var raw =
              localStorage.getItem('decap-cms-user') ||
              localStorage.getItem('netlify-cms-user')
            if (raw) {
              var u = JSON.parse(raw)
              if (u && u.token) {
                setTimeout(function () {
                  try {
                    window.postMessage(
                      JSON.stringify({ token: u.token, provider: 'github' }),
                      '*'
                    )
                  } catch (e) {}
                  if (
                    !location.hash ||
                    location.hash === '#/' ||
                    location.hash === '#'
                  ) {
                    location.hash = '#/collections/collections'
                  }
                }, 60)
              }
            }
          } catch (e) {}
        })

        if (
          document.readyState === 'complete' ||
          document.readyState === 'interactive'
        )
          start()
        else window.addEventListener('DOMContentLoaded', start)
      })()
    </script>
  </body>
</html>
