<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NorthSide GTA CMS</title>
    <style>
      html,
      body,
      #nc-root {
        height: 100%;
        margin: 0;
      }
    </style>
    <script>
      window.CMS_MANUAL_INIT = true
    </script>
  </head>
  <body>
    <div id="nc-root"></div>

    <!-- Pin to stable Decap -->
    <script src="https://unpkg.com/decap-cms@3.5.0/dist/decap-cms.js"></script>

    <script>
      ;(function () {
        let ran = false
        function start() {
          if (ran) return
          ran = true
          if (!window.CMS || !CMS.init) {
            ran = false
            return setTimeout(start, 40)
          }

          // Initialize Decap ONCE with our config in /cms/
          CMS.init({ config: '/cms/config.yml' })

          // If a token already exists, replay JSON handshake and jump to list
          try {
            var raw =
              localStorage.getItem('decap-cms-user') ||
              localStorage.getItem('netlify-cms-user')
            if (raw) {
              var u = JSON.parse(raw)
              if (u && u.token) {
                setTimeout(function () {
                  try {
                    window.postMessage(
                      JSON.stringify({ token: u.token, provider: 'github' }),
                      '*'
                    )
                  } catch (e) {}
                  if (
                    !location.hash ||
                    location.hash === '#/' ||
                    location.hash === '#'
                  ) {
                    location.hash = '#/collections/collections'
                  }
                }, 80)
              }
            }
          } catch (e) {}
        }
        if (
          document.readyState === 'complete' ||
          document.readyState === 'interactive'
        )
          start()
        else window.addEventListener('DOMContentLoaded', start)
      })()
    </script>
  </body>
</html>
