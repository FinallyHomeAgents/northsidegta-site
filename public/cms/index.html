<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NorthSide GTA CMS</title>
    <style>
      html,
      body,
      #nc-root {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="nc-root"></div>

    <!-- Pin to a stable Decap build -->
    <script src="https://unpkg.com/decap-cms@3.5.0/dist/decap-cms.js"></script>

    <script>
      // Initialize Decap explicitly and, if a token already exists, replay the JSON message
      ;(function () {
        function start() {
          if (!window.CMS || !CMS.init) return setTimeout(start, 30)

          // 1) Explicitly load config from ROOT (/config.yml)
          try {
            CMS.init({ config: '/config.yml' })
          } catch (e) {}

          // 2) If a token is stored, replay JSON so the auth listener fires
          try {
            var raw =
              localStorage.getItem('decap-cms-user') ||
              localStorage.getItem('netlify-cms-user')
            if (raw) {
              var u = JSON.parse(raw)
              if (u && u.token) {
                setTimeout(function () {
                  try {
                    window.postMessage(
                      JSON.stringify({ token: u.token, provider: 'github' }),
                      '*'
                    )
                  } catch (e) {}
                  if (
                    !location.hash ||
                    location.hash === '#/' ||
                    location.hash === '#'
                  ) {
                    location.hash = '#/collections/collections'
                  }
                }, 60)
              }
            }
          } catch (e) {}
        }
        if (
          document.readyState === 'complete' ||
          document.readyState === 'interactive'
        )
          start()
        else window.addEventListener('DOMContentLoaded', start)
      })()
    </script>
  </body>
</html>
