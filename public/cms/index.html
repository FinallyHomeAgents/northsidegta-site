<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NorthSide GTA CMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif;
        color:#0f172a;
      }
      body.cms-loaded { display:block; background:#f8fafc; }
      #cms-controls{position:fixed;top:16px;right:16px;z-index:1000;display:none}
      body.cms-loaded #cms-controls{display:block}
      #events-admin-link{
        margin-right:12px;padding:8px 16px;border-radius:999px;background:rgba(37,99,235,.12);
        color:#1d4ed8;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;gap:6px
      }
      #logout-button{padding:8px 14px;border-radius:999px;border:none;background:#0f172a;color:#f8fafc;font-size:13px;font-weight:600;cursor:pointer}
      #login-container{
        width:min(90%,380px);background:rgba(255,255,255,.92);border-radius:18px;padding:32px 28px;
        box-shadow:0 25px 70px rgba(15,23,42,.35);backdrop-filter:blur(12px);transition:opacity .3s
      }
      body.cms-loaded #login-container{display:none}
      h1{margin:0 0 16px;font-size:24px;font-weight:600;text-align:center;color:#0f172a}
      p.description{margin:0 0 24px;font-size:15px;color:#475569;text-align:center}
      label{display:block;margin-bottom:16px}
      label span{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:#1e293b}
      input[type='text'],input[type='password']{
        width:100%;padding:12px 14px;border-radius:10px;border:1px solid #cbd5f5;background:#f8fafc;font-size:14px
      }
      button[type='submit']{
        width:100%;padding:12px 16px;border:none;border-radius:999px;background:#2563eb;color:#fff;font-weight:600;font-size:15px;cursor:pointer
      }
      #login-status{min-height:20px;margin-top:16px;font-size:13px;text-align:center;color:#dc2626}
    </style>

    <!-- Tell Decap not to auto-init -->
    <script>window.CMS_MANUAL_INIT = true;</script>

    <!-- Single, pinned Decap bundle. Init ONCE on load. -->
    <script
      src="https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js"
      onload="(function(){ if (window.CMS && typeof CMS.init==='function' && !window.__nsCmsInitialized) { CMS.init(); window.__nsCmsInitialized=true; console.info('[cms] CMS.init() once'); } })();">
    </script>
  </head>

  <body>
    <div id="cms-controls">
      <a id="events-admin-link" href="/community/events-admin" target="_blank" rel="noopener noreferrer">Community Events Admin</a>
      <button id="logout-button" type="button">Log out</button>
    </div>

    <div id="login-container">
      <form id="cms-login-form" autocomplete="on">
        <h1>Welcome back</h1>
        <p class="description">Sign in to manage your NorthSide GTA content.</p>
        <label>
          <span>Username</span>
          <input type="text" name="username" id="username" autocomplete="username" required />
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" id="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign in</button>
        <div id="login-status" role="status" aria-live="polite"></div>
      </form>
    </div>

    <script>
      (function () {
        // ---------- Auth helpers ----------
        const STORAGE_KEYS = ['decap-cms-user', 'netlify-cms-user'];
        const form = document.getElementById('cms-login-form');
        const statusEl = document.getElementById('login-status');
        const logoutButton = document.getElementById('logout-button');
        const submitButton = form.querySelector("button[type='submit']");
        const defaultButtonText = submitButton.textContent;

        const setStatus = (msg, isError) => { statusEl.textContent = msg || ''; statusEl.style.color = isError ? '#dc2626' : '#0f172a'; };
        const setLoading = (b) => { submitButton.disabled = b; submitButton.textContent = b ? 'Signing in…' : defaultButtonText; };
        const clearStoredTokens = () => { try { STORAGE_KEYS.forEach(k => localStorage.removeItem(k)); } catch {} };
        const storeToken = (token, username) => {
          try {
            const name = (typeof username==='string' && username.trim()) ? username.trim() : 'CMS User';
            const payload = JSON.stringify({ token, backendName:'github', login:name, name });
            STORAGE_KEYS.forEach(k => localStorage.setItem(k, payload));
          } catch {}
        };
        const getStoredUser = () => {
          try {
            for (const k of STORAGE_KEYS) {
              const raw = localStorage.getItem(k); if (!raw) continue;
              try { const v = JSON.parse(raw); if (v && typeof v.token === 'string' && v.token.length) return v; }
              catch { localStorage.removeItem(k); }
            }
          } catch {}
          return null;
        };

        // ---------- “Ready” detection & widget fallback ----------
        function findDecapIframeContext() {
          const frames = Array.from(document.querySelectorAll('iframe'));
          for (const f of frames) {
            try {
              const w = f.contentWindow;
              if (w?.CMS && typeof w.CMS.registerWidget === 'function') {
                return { w, CMS: w.CMS, React: w.React || w.CMS.React || w.CMS?.imports?.React || null };
              }
            } catch { /* cross-origin safe */ }
          }
          // Some Decap builds expose CMS on top iframes aren’t ready yet:
          if (window.CMS && typeof window.CMS.registerWidget === 'function') {
            return { w: window, CMS: window.CMS, React: window.React || window.CMS.React || window.CMS?.imports?.React || null };
          }
          return null;
        }

        function whenIframeReady(cb, timeoutMs = 12000) {
          const start = Date.now();
          (function tick(){
            const ctx = findDecapIframeContext();
            if (ctx) return cb(ctx);
            if (Date.now() - start > timeoutMs) return console.warn('[cms] iframe/CMS not ready (timed out)');
            setTimeout(tick, 150);
          })();
        }

        function registerDailyScheduleFallback(ctx) {
          const { CMS } = ctx;
          try {
            // If your custom control is not yet loaded, expose a safe fallback so the field renders.
            if (!CMS.getWidget('dailySchedule')) {
              const base = CMS.getWidget('list') || CMS.getWidget('object') || CMS.getWidget('string');
              if (base?.control) {
                CMS.registerWidget('dailySchedule', base.control, base.preview);
                console.info('[cms] dailySchedule registered as fallback control');
              }
            }
          } catch (e) {
            console.warn('[cms] dailySchedule fallback registration failed', e);
          }
        }

        // ---------- Login submit ----------
        async function handleLogin(e){
          e.preventDefault();
          const fd = new FormData(form);
          const username = (fd.get('username') || '').trim();
          const password = fd.get('password') || '';
          if (!username || !password) { setStatus('Enter both your username and password.', true); return; }
          setLoading(true); setStatus('Signing in…', false);

          try {
            const res = await fetch('/api/cms-login', {
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ username, password }),
              credentials:'same-origin'
            });
            const payload = await res.json().catch(()=>({}));
            if (!res.ok || !payload.token) {
              clearStoredTokens();
              setStatus(payload.error || 'Login failed. Please check your credentials.', true);
              setLoading(false);
              return;
            }
            storeToken(payload.token, username);
            setStatus('Signed in! Loading the CMS…', false);
            document.body.classList.add('cms-loaded');

            // Wait for Decap app to mount, then ensure our widget name exists
            whenIframeReady(registerDailyScheduleFallback);
            setLoading(false);
          } catch (err) {
            console.error('[cms-login] request failed', err);
            setStatus('We could not reach the server. Please try again.', true);
            setLoading(false);
          }
        }

        function handleLogout(){ clearStoredTokens(); window.location.replace('/cms/'); }

        form.addEventListener('submit', handleLogin);
        logoutButton.addEventListener('click', handleLogout);

        // ---------- Auto-enter if already logged in ----------
        if (getStoredUser()) {
          document.body.classList.add('cms-loaded');
          whenIframeReady(registerDailyScheduleFallback);
          // Optional: route to collections screen on first load
          if (!location.hash || location.hash === '#') location.replace('#/collections');
        } else {
          requestAnimationFrame(() => { try { document.getElementById('username')?.focus(); } catch{} });
        }
      })();
    </script>
  </body>
</html>
