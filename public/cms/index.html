<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NorthSide GTA CMS</title>
    <style>
      html,
      body,
      #nc-root {
        height: 100%;
        margin: 0;
      }
    </style>
    <script>
      window.CMS_MANUAL_INIT = true
    </script>
  </head>
  <body>
    <div id="nc-root"></div>

    <script src="https://unpkg.com/decap-cms@3.5.0/dist/decap-cms.js"></script>

    <!-- Inline config -->
    <script>
      window.CMS_CONFIG = {
        backend: {
          name: 'github',
          repo: 'FinallyHomeAgents/northsidegta-site',
          branch: 'main',
          base_url: 'https://northsidegta.ca',
          auth_endpoint: '/api/oauth/start',
        },
        media_folder: 'public/uploads',
        public_folder: '/uploads',
        collections: [
          {
            name: 'collections',
            label: 'Curated Collections',
            folder: 'public/data/collections',
            create: true,
            extension: 'json',
            format: 'json',
            identifier_field: 'slug',
            slug: '{{slug}}',
            fields: [
              { name: 'title', label: 'Page Title' },
              {
                name: 'slug',
                label: 'Slug (URL part)',
                widget: 'string',
                pattern: [
                  '^[a-z0-9-]+$',
                  'Use lowercase letters, numbers, and dashes only',
                ],
              },
              { name: 'intro', label: 'Intro (optional)', required: false },
              { name: 'realmLink', label: 'Realm Link (the private URL)' },
              {
                name: 'heroImage',
                label: 'Hero Image',
                widget: 'image',
                required: false,
              },
            ],
          },
        ],
      }
    </script>

    <script>
      ;(function () {
        function boot() {
          if (!window.CMS || !CMS.init) return setTimeout(boot, 40)

          try {
            CMS.init({ config: window.CMS_CONFIG })
            window.__cmsInited = true
          } catch (e) {
            window.__cmsErr = e
            console.error('[cms] CMS.init error:', e)
            return
          }

          // Token bootstrap: replay token a few times after load so Decap definitely receives it
          var tries = 0
          ;(function pump() {
            tries++
            try {
              var raw =
                localStorage.getItem('decap-cms-user') ||
                localStorage.getItem('netlify-cms-user')
              if (raw) {
                var u = JSON.parse(raw)
                if (u && u.token) {
                  try {
                    window.postMessage(
                      JSON.stringify({ token: u.token, provider: 'github' }),
                      '*'
                    )
                  } catch (e) {}
                  if (
                    !location.hash ||
                    location.hash === '#/' ||
                    location.hash === '#'
                  ) {
                    location.hash = '#/collections/collections'
                  }
                }
              }
            } catch (e) {}
            if (tries < 25) setTimeout(pump, 200) // ~5s total
          })()
        }
        boot()
      })()
    </script>
  </body>
</html>
