backend:
  name: github
  repo: FinallyHomeAgents/northsidegta-site
  branch: main

media_folder: 'public/uploads'
public_folder: '/uploads'
media_folder_relative: false

collections:
  - name: 'collections'
    label: 'Curated Collections'
    folder: 'public/data/collections'
    create: true
    extension: 'json'
    format: 'json'
    identifier_field: 'slug'
    slug: '{{slug}}'
    fields:
      - name: 'headline'
        label: 'Headline'
      - name: 'subheadline'
        label: 'Subheadline'
        widget: 'text'
        required: false
        default: 'Bigger lots, more value, and less traffic — get the listings now.'
      - name: 'slug'
        label: 'Slug (URL part)'
        widget: 'string'
        pattern:
          - '^[a-z0-9-]+$'
          - 'Use lowercase letters, numbers, and dashes only'
      - name: 'realmLink'
        label: 'Realm Link (the private URL)'
      - name: 'ctaText'
        label: 'CTA Button Text'
        required: false
        default: 'Send Me the Listings'
      - name: 'showWhatsappLink'
        label: 'Show WhatsApp link in footer'
        widget: 'boolean'
        required: false
        default: false
      - name: 'whatsappUrl'
        label: 'WhatsApp URL'
        required: false
        pattern:
          - '^https://wa\.me/[0-9]+.*$'
          - 'Enter a link like https://wa.me/16476684646 with the full phone number.'
        hint: 'Use https://wa.me/<number> optionally followed by ?text=… for a prefilled message.'
      - name: 'thankYouGuideLabel'
        label: 'Buyer’s Guide Label (optional)'
        required: false
      - name: 'thankYouGuideUrl'
        label: 'Buyer’s Guide PDF URL (optional)'
        required: false
      - name: 'seoDescription'
        label: 'SEO Description'
        widget: 'text'
        required: false
      - name: 'heroImage'
        label: 'Hero Image'
        widget: 'image'
        required: false
        hint: 'Upload a 1920×1080 (16:9) JPG/PNG for best results.'
      - name: 'legacyTitle'
        label: 'Legacy Page Title'
        widget: 'string'
        required: false
        hint: 'Optional: only needed if older automations depend on the original title field.'

  - name: 'contact-page'
    label: 'Contact Page'
    files:
      - label: 'Contact Page'
        name: 'contact-page'
        file: 'public/data/contact-page.json'
        delete: false
        extension: 'json'
        format: 'json'
        fields:
          - { name: 'heroHeadline', label: 'Hero Headline' }
          - name: 'heroSubhead'
            label: 'Hero Subhead'
            widget: 'text'
          - { name: 'responsePledge', label: 'Response-time Pledge', required: false }
          - { name: 'coverageLine', label: 'Coverage Line', required: false }
          - { name: 'heroBackgroundImage', label: 'Hero Background Image', widget: 'image', required: false }
          - { name: 'heroBackgroundBlendMode', label: 'Hero Background Blend Mode', required: false }
          - name: 'heroBackgroundOpacity'
            label: 'Hero Background Opacity (0-1)'
            widget: 'number'
            min: 0
            max: 1
            step: 0.05
          - { name: 'heroPrimaryCtaLabel', label: 'Primary CTA Label', required: false }
          - { name: 'heroSecondaryCtaLabel', label: 'Secondary CTA Label', required: false }
          - { name: 'whatsappConciergeLabel', label: 'WhatsApp Concierge Label', required: false }
          - { name: 'defaultWhatsAppNumber', label: 'WhatsApp Number Fallback (digits only)', required: false }
          - { name: 'contactMicrocopy', label: 'Contact Microcopy', required: false }
          - name: 'trustBullets'
            label: 'Trust Bullets'
            widget: 'list'
            field:
              name: 'bullet'
              label: 'Bullet'
          - name: 'trustBadges'
            label: 'Trust Badges'
            widget: 'list'
            required: false
            fields:
              - { name: 'label', label: 'Label', required: false }
              - { name: 'image', label: 'Image', widget: 'image', required: false }
              - { name: 'alt', label: 'Alt Text', required: false }
          - { name: 'reviewsDisclaimer', label: 'Reviews Disclaimer', required: false }
          - name: 'reviews'
            label: 'Reviews'
            widget: 'list'
            required: false
            fields:
              - { name: 'name', label: 'Reviewer Name' }
              - name: 'rating'
                label: 'Rating'
                widget: 'number'
                min: 1
                max: 5
                default: 5
              - name: 'quote'
                label: 'Quote'
                widget: 'text'
              - { name: 'date', label: 'Date', required: false }
          - { name: 'showSchedulingCard', label: 'Show Scheduling Card', widget: 'boolean', required: false, default: false }
          - { name: 'schedulingLabel', label: 'Scheduling CTA Label', required: false }
          - name: 'schedulingSubcopy'
            label: 'Scheduling Subcopy'
            widget: 'text'
            required: false
          - { name: 'schedulingUrl', label: 'Scheduling URL', required: false }
          - name: 'footerAgents'
            label: 'Footer Agents'
            widget: 'list'
            required: false
            fields:
              - { name: 'name', label: 'Name' }
              - { name: 'title', label: 'Title', required: false }
              - { name: 'descriptor', label: 'Descriptor', required: false }
              - { name: 'brokerage', label: 'Brokerage', required: false }
              - { name: 'email', label: 'Email Link', required: false }
              - { name: 'emailLabel', label: 'Email Label', required: false }
              - { name: 'phoneLabel', label: 'Phone Label', required: false }
          - name: 'footerBrokerageCopy'
            label: 'Brokerage Copy'
            widget: 'text'
          - { name: 'footerAreas', label: 'Service Areas', required: false }
          - name: 'footerSecondaryLinks'
            label: 'Footer Secondary Links'
            widget: 'list'
            required: false
            fields:
              - { name: 'label', label: 'Label' }
              - { name: 'href', label: 'URL' }
          - name: 'formThankYouMessage'
            label: 'Form Thank-you Message'
            widget: 'text'
            required: false
          - { name: 'seoTitle', label: 'SEO Title' }
          - name: 'seoDescription'
            label: 'SEO Description'
            widget: 'text'
          - { name: 'seoImage', label: 'SEO Image', widget: 'image', required: false }
          - name: 'jsonLd'
            label: 'Advanced JSON-LD Overrides'
            widget: 'object'
            required: false
            fields:
              - name: 'sameAs'
                label: 'Same As URLs'
                widget: 'list'
                required: false
                field:
                  name: 'url'
                  label: 'URL'
              - name: 'areaServed'
                label: 'Areas Served'
                widget: 'list'
                required: false
                field:
                  name: 'area'
                  label: 'Area'

