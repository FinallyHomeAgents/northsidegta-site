  - name: "socials"
    label: "Socials"
    editor: { preview: false }
    files:
      - name: "socials_settings"
        label: "Videos + Reels Settings"
        file: "public/content/socials-settings.json"
        format: "json"
        fields:
          - label: "Pinned Hero"
            name: "pinned"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", default: "Videos + Reels" }
              - { label: "Tagline", name: "tagline", widget: "string", required: false, hint: "e.g., Stories from the NorthSide" }
              - { label: "Pinned Source URL", name: "source_url", widget: "string", hint: "Paste an Instagram permalink OR a local /uploads/*.mp4|.webm" }
              - { label: "Poster Image (optional)", name: "poster_url", widget: "string", required: false, hint: "/uploads/hero-poster.jpg" }
              - { label: "Captioned IG Embed", name: "captioned", widget: "boolean", default: false }
              - { label: "Enable Hero", name: "enabled", widget: "boolean", default: true }

      - name: "media_links"
        label: "Media Links"
        file: "public/content/socials.json"
        format: "json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{fields.url}}"
            fields:
              - { label: "URL", name: "url", widget: "string", hint: "Instagram post/reel/video/photo permalink" }
              - { label: "Title (optional)", name: "title", widget: "string", required: false }
              - { label: "Date", name: "date", widget: "datetime", required: false }
              - { label: "Pin", name: "pin", widget: "boolean", default: false }
              - { label: "Show Caption", name: "captioned", widget: "boolean", default: false }
              - { label: "Published", name: "published", widget: "boolean", default: true }

  - name: 'events'
    label: 'Community Events'
    label_singular: 'Event'
    folder: 'public/data/events'
    create: true
    identifier_field: 'slug'
    slug: '{{slug}}'
    extension: 'json'
    format: 'json'
    # Note: Decap does not support setting a default sort; editors must use the Sort menu.
    summary: "{{title}} — {{startDate | date('ddd, MMM D h:mm a')}} — {{town | default('')}}{{locationName | ternary(', ', '')}}{{locationName | default('')}} — Status: {{status | upper}}{{hidden | ternary(' • HIDDEN', '')}}{{archived | ternary(' • ARCHIVED', '')}}"
    sortable_fields: ['startDate', 'status', 'commit_date']
    view_filters:
      - label: Published
        field: status
        pattern: '^(published|approved)$'
      - label: Unpublished
        field: status
        pattern: '^(draft|pending|archived)$'
      - label: Hidden
        field: hidden
        pattern: '^true$'
      - label: Not Hidden
        field: hidden
        pattern: '^(false|)$'
      - label: Archived
        field: archived
        pattern: '^true$'
      - label: Not Archived
        field: archived
        pattern: '^(false|)$'
    fields:
      - { name: 'title', label: 'Title' }
      - name: 'slug'
        label: 'Slug (URL part)'
        widget: 'string'
        pattern:
          - '^[a-z0-9-]+$'
          - 'Use lowercase letters, numbers, and dashes only.'
      - name: 'startDate'
        label: 'Start Date & Time'
        widget: 'datetime'
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
      - name: 'endDate'
        label: 'End Date & Time'
        widget: 'datetime'
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
        required: false
        hint: 'Leave blank for single-day events.'
      - name: 'allDay'
        label: 'All day event'
        widget: 'boolean'
        required: false
        default: false
      - name: 'use_daily_schedule'
        label: 'Enable Daily Schedule'
        widget: 'boolean'
        required: false
        default: false
        hint: 'Toggle on to manage per-day hours below. Leave off to fall back to the start/end fields.'
      - name: 'daily_schedule'
        label: 'Daily Schedule'
        widget: 'list'
        required: false
        collapsed: false
        hint: 'Add one row per day with optional start/end times. Data stays saved even if the toggle is off.'
        summary: "{{date}} — {{ all_day | ternary('All day', (start_time | default(''))) }} {{ end_time | default('') }}"
        fields:
          - name: 'date'
            label: 'Date'
            widget: 'datetime'
            date_format: 'YYYY-MM-DD'
            time_format: false
            format: 'YYYY-MM-DD'
          - name: 'all_day'
            label: 'All day'
            widget: 'boolean'
            required: false
            default: false
          - name: 'start_time'
            label: 'Start time'
            widget: 'datetime'
            required: false
            date_format: false
            time_format: 'HH:mm'
            format: 'HH:mm'
          - name: 'end_time'
            label: 'End time'
            widget: 'datetime'
            required: false
            date_format: false
            time_format: 'HH:mm'
            format: 'HH:mm'
      - name: 'recurrence'
        label: 'Recurrence (RRULE)'
        widget: 'string'
        required: false
        hint: 'Optional RRULE string for repeating events (e.g., FREQ=WEEKLY;BYDAY=SA).'
      - name: 'category'
        label: 'Category'
        widget: 'select'
        options: ['Family', 'Festivals', 'Sports', 'Golf', 'Markets', 'Arts & Culture', 'Outdoors', 'Other']
      - name: 'town'
        label: 'Town / Area'
        widget: 'select'
        options: ['Aurora', 'Uxbridge', 'Georgina', 'Stouffville', 'East Gwillimbury', 'Newmarket', 'Scugog', 'Toronto-adjacent']
      - { name: 'locationName', label: 'Location Name' }
      - { name: 'address', label: 'Street Address' }
      - name: 'lat'
        label: 'Latitude'
        widget: 'number'
        required: false
      - name: 'lng'
        label: 'Longitude'
        widget: 'number'
        required: false
      - name: 'priceType'
        label: 'Price Type'
        widget: 'select'
        options: ['Free', 'Paid', 'Mixed']
        default: 'Free'
      - name: 'priceNote'
        label: 'Price Note'
        widget: 'text'
        required: false
      - name: 'badges'
        label: 'Badges'
        widget: 'select'
        multiple: true
        options: ['Family-friendly', 'Seasonal', 'Outdoors', 'Pets OK', 'Accessible']
        required: false
      - name: 'image'
        label: 'Image'
        widget: 'image'
        required: false
        hint: 'Upload a 3:2 or 16:9 photo. Optional — a neutral placeholder appears if empty.'
      - name: 'summary'
        label: 'List Summary (140–180 characters)'
        widget: 'text'
        hint: 'Appears in card view. Keep concise and informative.'
      - name: 'description'
        label: 'Full Description'
        widget: 'markdown'
      - name: 'organizerName'
        label: 'Organizer Name'
        required: false
      - name: 'organizerUrl'
        label: 'Organizer URL'
        required: false
      - name: 'eventUrl'
        label: 'Event Website'
        widget: 'string'
        required: true
      - name: 'icsUrl'
        label: 'ICS File URL'
        widget: 'string'
        required: false
        hint: 'Optional external calendar link. Leave blank to auto-generate.'
      - name: 'featured'
        label: 'Featured This Week'
        widget: 'boolean'
        required: false
        default: false
      - name: 'hidden'
        label: 'Hide from public lists & sitemap'
        widget: 'boolean'
        required: false
        default: false
      - name: 'archived'
        label: 'Move to Archive'
        widget: 'boolean'
        required: false
        default: false
      - name: 'status'
        label: 'Status'
        widget: 'select'
        options: ['draft', 'pending', 'approved', 'published', 'archived']
        default: 'pending'
      - name: 'source'
        label: 'Source'
        widget: 'select'
        options: ['manual', 'feed']
        default: 'manual'
      - name: 'sourceRef'
        label: 'Source Reference'
        required: false
        hint: 'Auto-filled for feed items. Leave blank for manual events.'
      - name: 'updatedAt'
        label: 'Last Updated'
        widget: 'datetime'
        required: false
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
        hint: 'Optional — ingestion fills this automatically.'

