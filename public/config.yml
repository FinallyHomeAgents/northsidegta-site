backend:
  name: github
  repo: FinallyHomeAgents/northsidegta-site
  branch: main

media_folder: 'public/uploads'
public_folder: '/uploads'

collections:
  - name: 'collections'
    label: 'Curated Collections'
    folder: 'public/data/collections'
    create: true
    extension: 'json'
    format: 'json'
    identifier_field: 'slug'
    slug: '{{slug}}'
    fields:
      - name: 'headline'
        label: 'Headline'
      - name: 'subheadline'
        label: 'Subheadline'
        widget: 'text'
        required: false
        default: 'Bigger lots, more value, and less traffic — get the listings now.'
      - name: 'slug'
        label: 'Slug (URL part)'
        widget: 'string'
        pattern:
          - '^[a-z0-9-]+$'
          - 'Use lowercase letters, numbers, and dashes only'
      - name: 'realmLink'
        label: 'Realm Link (the private URL)'
      - name: 'ctaText'
        label: 'CTA Button Text'
        required: false
        default: 'Send Me the Listings'
      - name: 'showWhatsappLink'
        label: 'Show WhatsApp link in footer'
        widget: 'boolean'
        required: false
        default: false
      - name: 'whatsappUrl'
        label: 'WhatsApp URL'
        required: false
        pattern:
          - '^https://wa\.me/[0-9]+.*$'
          - 'Enter a link like https://wa.me/16476684646 with the full phone number.'
        hint: 'Use https://wa.me/<number> optionally followed by ?text=… for a prefilled message.'
      - name: 'thankYouGuideLabel'
        label: 'Buyer’s Guide Label (optional)'
        required: false
      - name: 'thankYouGuideUrl'
        label: 'Buyer’s Guide PDF URL (optional)'
        required: false
      - name: 'seoDescription'
        label: 'SEO Description'
        widget: 'text'
        required: false
      - name: 'heroImage'
        label: 'Hero Image'
        widget: 'image'
        required: false
        hint: 'Upload a 1920×1080 (16:9) JPG/PNG for best results.'
      - name: 'legacyTitle'
        label: 'Legacy Page Title'
        widget: 'string'
        required: false
        hint: 'Optional: only needed if older automations depend on the original title field.'

  - name: 'insights'
    label: 'Insights'
    label_singular: 'Insight'
    folder: 'public/content/insights'
    create: true
    path: '{{slug}}/index'
    slug: '{{slug}}'
    extension: 'md'
    format: 'frontmatter'
    media_folder: 'public/uploads/insights'
    public_folder: '/uploads/insights'
    editor:
      preview: true
    fields:
      - name: 'title'
        label: 'Title'
        widget: 'string'
      - name: 'publishDate'
        label: 'Publish Date'
        widget: 'datetime'
        time_format: false
      - name: 'author'
        label: 'Author'
        widget: 'string'
      - name: 'excerpt'
        label: 'Excerpt'
        widget: 'text'
        hint: 'Used for SEO and social previews (150–160 characters recommended).'
      - name: 'tags'
        label: 'Tags'
        widget: 'list'
        allow_add: true
        summary: '{{fields.item}}'
        field:
          name: 'item'
          label: 'Tag'
          widget: 'string'
      - name: 'featureImage'
        label: 'Feature Image'
        widget: 'image'
        media_folder: ''
        public_folder: ''
        hint: 'Upload a horizontal image (1200×630 recommended). Stored in /uploads/insights.'
      - name: 'featureImageAlt'
        label: 'Feature Image Alt'
        widget: 'string'
      - name: 'featureImageCredit'
        label: 'Feature Image Credit'
        widget: 'string'
        required: false
      - name: 'body'
        label: 'Body'
        widget: 'markdown'
        buttons:
          [
            'bold',
            'italic',
            'link',
            'heading-two',
            'heading-three',
            'quote',
            'bulleted-list',
            'numbered-list',
            'code',
            'image'
          ]
        editor_components: ['image']
      - name: 'gallery'
        label: 'Gallery'
        widget: 'list'
        required: false
        summary: '{{fields.image}}'
        fields:
          - name: 'image'
            label: 'Image'
            widget: 'image'
            media_folder: ''
            public_folder: ''
          - name: 'alt'
            label: 'Alt Text'
            widget: 'string'
            required: false
          - name: 'caption'
            label: 'Caption'
            widget: 'string'
            required: false
      - name: 'seo'
        label: 'SEO Overrides'
        widget: 'object'
        required: false
        collapsed: true
        fields:
          - name: 'title'
            label: 'Custom Title'
            widget: 'string'
            required: false
          - name: 'description'
            label: 'Custom Description'
            widget: 'text'
            required: false
          - name: 'ogImage'
            label: 'Custom OG Image'
            widget: 'image'
            required: false
            media_folder: ''
            public_folder: ''

  - name: 'contact-page'
    label: 'Contact Page'
    files:
      - label: 'Contact Page'
        name: 'contact-page'
        file: 'public/data/contact-page.json'
        delete: false
        extension: 'json'
        format: 'json'
        fields:
          - { name: 'heroHeadline', label: 'Hero Headline' }
          - name: 'heroSubhead'
            label: 'Hero Subhead'
            widget: 'text'
          - { name: 'responsePledge', label: 'Response-time Pledge', required: false }
          - { name: 'coverageLine', label: 'Coverage Line', required: false }
          - { name: 'heroBackgroundImage', label: 'Hero Background Image', widget: 'image', required: false }
          - { name: 'heroBackgroundBlendMode', label: 'Hero Background Blend Mode', required: false }
          - name: 'heroBackgroundOpacity'
            label: 'Hero Background Opacity (0-1)'
            widget: 'number'
            min: 0
            max: 1
            step: 0.05
          - { name: 'heroPrimaryCtaLabel', label: 'Primary CTA Label', required: false }
          - { name: 'heroSecondaryCtaLabel', label: 'Secondary CTA Label', required: false }
          - { name: 'whatsappConciergeLabel', label: 'WhatsApp Concierge Label', required: false }
          - { name: 'defaultWhatsAppNumber', label: 'WhatsApp Number Fallback (digits only)', required: false }
          - { name: 'contactMicrocopy', label: 'Contact Microcopy', required: false }
          - name: 'trustBullets'
            label: 'Trust Bullets'
            widget: 'list'
            field:
              name: 'bullet'
              label: 'Bullet'
          - name: 'trustBadges'
            label: 'Trust Badges'
            widget: 'list'
            required: false
            fields:
              - { name: 'label', label: 'Label', required: false }
              - { name: 'image', label: 'Image', widget: 'image', required: false }
              - { name: 'alt', label: 'Alt Text', required: false }
          - { name: 'reviewsDisclaimer', label: 'Reviews Disclaimer', required: false }
          - name: 'reviews'
            label: 'Reviews'
            widget: 'list'
            required: false
            fields:
              - { name: 'name', label: 'Reviewer Name' }
              - name: 'rating'
                label: 'Rating'
                widget: 'number'
                min: 1
                max: 5
                default: 5
              - name: 'quote'
                label: 'Quote'
                widget: 'text'
              - { name: 'date', label: 'Date', required: false }
          - { name: 'showSchedulingCard', label: 'Show Scheduling Card', widget: 'boolean', required: false, default: false }
          - { name: 'schedulingLabel', label: 'Scheduling CTA Label', required: false }
          - name: 'schedulingSubcopy'
            label: 'Scheduling Subcopy'
            widget: 'text'
            required: false
          - { name: 'schedulingUrl', label: 'Scheduling URL', required: false }
          - name: 'footerAgents'
            label: 'Footer Agents'
            widget: 'list'
            required: false
            fields:
              - { name: 'name', label: 'Name' }
              - { name: 'title', label: 'Title', required: false }
              - { name: 'descriptor', label: 'Descriptor', required: false }
              - { name: 'brokerage', label: 'Brokerage', required: false }
              - { name: 'email', label: 'Email Link', required: false }
              - { name: 'emailLabel', label: 'Email Label', required: false }
              - { name: 'phoneLabel', label: 'Phone Label', required: false }
          - name: 'footerBrokerageCopy'
            label: 'Brokerage Copy'
            widget: 'text'
          - { name: 'footerAreas', label: 'Service Areas', required: false }
          - name: 'footerSecondaryLinks'
            label: 'Footer Secondary Links'
            widget: 'list'
            required: false
            fields:
              - { name: 'label', label: 'Label' }
              - { name: 'href', label: 'URL' }
          - name: 'formThankYouMessage'
            label: 'Form Thank-you Message'
            widget: 'text'
            required: false
          - { name: 'seoTitle', label: 'SEO Title' }
          - name: 'seoDescription'
            label: 'SEO Description'
            widget: 'text'
          - { name: 'seoImage', label: 'SEO Image', widget: 'image', required: false }
          - name: 'jsonLd'
            label: 'Advanced JSON-LD Overrides'
            widget: 'object'
            required: false
            fields:
              - name: 'sameAs'
                label: 'Same As URLs'
                widget: 'list'
                required: false
                field:
                  name: 'url'
                  label: 'URL'
              - name: 'areaServed'
                label: 'Areas Served'
                widget: 'list'
                required: false
                field:
                  name: 'area'
                  label: 'Area'

  - name: 'events'
    label: 'Community Events'
    label_singular: 'Event'
    folder: 'public/data/events'
    create: true
    identifier_field: 'slug'
    slug: '{{slug}}'
    extension: 'json'
    format: 'json'
    # Note: Decap does not support setting a default sort; editors must use the Sort menu.
    summary: "{{title}} — {{startDate | date('ddd, MMM D h:mm a')}} — {{town | default('')}}{{locationName | ternary(', ', '')}}{{locationName | default('')}} — Status: {{status | upper}}{{hidden | ternary(' • HIDDEN', '')}}{{archived | ternary(' • ARCHIVED', '')}}"
    sortable_fields: ['startDate', 'status', 'commit_date']
    view_filters:
      - label: Published
        field: status
        pattern: '^(published|approved)$'
      - label: Unpublished
        field: status
        pattern: '^(draft|pending|archived)$'
      - label: Hidden
        field: hidden
        pattern: '^true$'
      - label: Not Hidden
        field: hidden
        pattern: '^(false|)$'
      - label: Archived
        field: archived
        pattern: '^true$'
      - label: Not Archived
        field: archived
        pattern: '^(false|)$'
    fields:
      - { name: 'title', label: 'Title' }
      - name: 'slug'
        label: 'Slug (URL part)'
        widget: 'string'
        pattern:
          - '^[a-z0-9-]+$'
          - 'Use lowercase letters, numbers, and dashes only.'
      - name: 'startDate'
        label: 'Start Date & Time'
        widget: 'datetime'
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
      - name: 'endDate'
        label: 'End Date & Time'
        widget: 'datetime'
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
        required: false
        hint: 'Leave blank for single-day events.'
      - name: 'allDay'
        label: 'All day event'
        widget: 'boolean'
        required: false
        default: false
      - name: 'use_daily_schedule'
        label: 'Enable Daily Schedule'
        widget: 'boolean'
        required: false
        default: false
        hint: 'Toggle on to manage per-day hours below. Leave off to fall back to the start/end fields.'
      - name: 'daily_schedule'
        label: 'Daily Schedule'
        widget: 'list'
        required: false
        collapsed: false
        hint: 'Add one row per day with optional start/end times. Data stays saved even if the toggle is off.'
        summary: "{{date}} — {{ all_day | ternary('All day', (start_time | default(''))) }} {{ end_time | default('') }}"
        fields:
          - name: 'date'
            label: 'Date'
            widget: 'datetime'
            date_format: 'YYYY-MM-DD'
            time_format: false
            format: 'YYYY-MM-DD'
          - name: 'all_day'
            label: 'All day'
            widget: 'boolean'
            required: false
            default: false
          - name: 'start_time'
            label: 'Start time'
            widget: 'datetime'
            required: false
            date_format: false
            time_format: 'HH:mm'
            format: 'HH:mm'
          - name: 'end_time'
            label: 'End time'
            widget: 'datetime'
            required: false
            date_format: false
            time_format: 'HH:mm'
            format: 'HH:mm'
      - name: 'recurrence'
        label: 'Recurrence (RRULE)'
        widget: 'string'
        required: false
        hint: 'Optional RRULE string for repeating events (e.g., FREQ=WEEKLY;BYDAY=SA).'
      - name: 'category'
        label: 'Category'
        widget: 'select'
        options: ['Family', 'Festivals', 'Sports', 'Golf', 'Markets', 'Arts & Culture', 'Outdoors', 'Other']
      - name: 'town'
        label: 'Town / Area'
        widget: 'select'
        options: ['Aurora', 'Uxbridge', 'Georgina', 'Stouffville', 'East Gwillimbury', 'Newmarket', 'Scugog', 'Toronto-adjacent']
      - { name: 'locationName', label: 'Location Name' }
      - { name: 'address', label: 'Street Address' }
      - name: 'lat'
        label: 'Latitude'
        widget: 'number'
        required: false
      - name: 'lng'
        label: 'Longitude'
        widget: 'number'
        required: false
      - name: 'priceType'
        label: 'Price Type'
        widget: 'select'
        options: ['Free', 'Paid', 'Mixed']
        default: 'Free'
      - name: 'priceNote'
        label: 'Price Note'
        widget: 'text'
        required: false
      - name: 'badges'
        label: 'Badges'
        widget: 'select'
        multiple: true
        options: ['Family-friendly', 'Seasonal', 'Outdoors', 'Pets OK', 'Accessible']
        required: false
      - name: 'image'
        label: 'Image'
        widget: 'image'
        required: false
        hint: 'Upload a 3:2 or 16:9 photo. Optional — a neutral placeholder appears if empty.'
      - name: 'summary'
        label: 'List Summary (140–180 characters)'
        widget: 'text'
        hint: 'Appears in card view. Keep concise and informative.'
      - name: 'description'
        label: 'Full Description'
        widget: 'markdown'
      - name: 'organizerName'
        label: 'Organizer Name'
        required: false
      - name: 'organizerUrl'
        label: 'Organizer URL'
        required: false
      - name: 'eventUrl'
        label: 'Event Website'
        widget: 'string'
        required: true
      - name: 'icsUrl'
        label: 'ICS File URL'
        widget: 'string'
        required: false
        hint: 'Optional external calendar link. Leave blank to auto-generate.'
      - name: 'featured'
        label: 'Featured This Week'
        widget: 'boolean'
        required: false
        default: false
      - name: 'hidden'
        label: 'Hide from public lists & sitemap'
        widget: 'boolean'
        required: false
        default: false
      - name: 'archived'
        label: 'Move to Archive'
        widget: 'boolean'
        required: false
        default: false
      - name: 'status'
        label: 'Status'
        widget: 'select'
        options: ['draft', 'pending', 'approved', 'published', 'archived']
        default: 'pending'
      - name: 'source'
        label: 'Source'
        widget: 'select'
        options: ['manual', 'feed']
        default: 'manual'
      - name: 'sourceRef'
        label: 'Source Reference'
        required: false
        hint: 'Auto-filled for feed items. Leave blank for manual events.'
      - name: 'updatedAt'
        label: 'Last Updated'
        widget: 'datetime'
        required: false
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
        hint: 'Optional — ingestion fills this automatically.'

  - name: 'pending-events'
    label: 'User Submitted Events (Pending)'
    label_singular: 'Pending Event'
    folder: 'public/data/events-pending'
    create: false
    identifier_field: 'slug'
    slug: '{{slug}}'
    extension: 'json'
    format: 'json'
    summary: "{{title}} — {{startDate | date('ddd, MMM D h:mm a')}} — {{town | default('')}}"
    fields:
      - { name: 'title', label: 'Title' }
      - name: 'slug'
        label: 'Slug (URL part)'
        widget: 'string'
        pattern:
          - '^[a-z0-9-]+$'
          - 'Use lowercase letters, numbers, and dashes only.'
      - name: 'status'
        label: 'Status'
        widget: 'select'
        options: ['pending', 'approved', 'published', 'archived']
        default: 'pending'
      - name: 'startDate'
        label: 'Start Date & Time'
        widget: 'datetime'
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
      - name: 'endDate'
        label: 'End Date & Time'
        widget: 'datetime'
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
        required: false
      - name: 'allDay'
        label: 'All day event'
        widget: 'boolean'
        required: false
        default: false
      - name: 'userEventType'
        label: 'Submitted Event Type'
        widget: 'select'
        options:
          [
            'Community',
            'Sports',
            'Family',
            'Arts & Culture',
            'Education',
            'Business/Networking',
            'Charity',
            'Other',
          ]
      - name: 'categoryTags'
        label: 'Category Tags'
        widget: 'select'
        multiple: true
        required: false
        options:
          [
            'Community',
            'Sports',
            'Family',
            'Arts & Culture',
            'Education',
            'Business/Networking',
            'Charity',
            'Other',
            'Fall',
            'Winter',
            'Spring',
            'Summer',
            'Holiday',
          ]
      - name: 'audienceTags'
        label: 'Audience Tags'
        widget: 'select'
        multiple: true
        required: false
        options: ['All ages', 'Kids', 'Teens', 'Adults', 'Seniors', 'Families']
      - name: 'town'
        label: 'City / Town'
        widget: 'select'
        options:
          [
            'Georgina',
            'East Gwillimbury',
            'Aurora',
            'Stouffville',
            'Uxbridge',
            'Scugog',
            'Newmarket',
            'Nearby/Other (North of Toronto)',
          ]
      - { name: 'locationName', label: 'Venue Name' }
      - { name: 'address', label: 'Street Address' }
      - name: 'postalCode'
        label: 'Postal Code'
        widget: 'string'
        required: false
      - name: 'priceType'
        label: 'Cost'
        widget: 'select'
        options: ['Free', 'Paid']
        default: 'Free'
      - name: 'priceFrom'
        label: 'Price From'
        widget: 'string'
        required: false
      - name: 'ticketsUrl'
        label: 'Tickets URL'
        widget: 'string'
        required: false
      - name: 'registrationUrl'
        label: 'Registration / Info URL'
        widget: 'string'
        required: false
      - name: 'image'
        label: 'Image'
        widget: 'image'
        required: false
        hint: 'Optional hero image uploaded by the community member.'
      - name: 'summary'
        label: 'Short Description'
        widget: 'text'
        hint: '140–200 characters max.'
      - name: 'description'
        label: 'Full Description'
        widget: 'markdown'
        required: false
      - name: 'organizerName'
        label: 'Organizer Name'
      - name: 'organizerEmail'
        label: 'Organizer Email (private)'
        widget: 'string'
      - name: 'eventUrl'
        label: 'Public Event Link'
        widget: 'string'
        required: false
      - name: 'source'
        label: 'Source'
        widget: 'hidden'
        default: 'user'
      - name: 'submittedAt'
        label: 'Submitted At'
        widget: 'datetime'
        required: false
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
      - name: 'contactConsent'
        label: 'Consent'
        widget: 'boolean'
        required: false
