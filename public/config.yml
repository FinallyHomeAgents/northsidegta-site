backend:
  name: github
  repo: FinallyHomeAgents/northsidegta-site
  branch: main

media_folder: 'public/uploads'
public_folder: '/uploads'

collections:
  - name: 'collections'
    label: 'Curated Collections'
    folder: 'public/data/collections'
    create: true
    extension: 'json'
    format: 'json'
    identifier_field: 'slug'
    slug: '{{slug}}'
    fields:
      - name: 'headline'
        label: 'Headline'
      - name: 'subheadline'
        label: 'Subheadline'
        widget: 'text'
        required: false
        default: 'Bigger lots, more value, and less traffic — get the listings now.'
      - name: 'slug'
        label: 'Slug (URL part)'
        widget: 'string'
        pattern:
          - '^[a-z0-9-]+$'
          - 'Use lowercase letters, numbers, and dashes only'
      - name: 'realmLink'
        label: 'Realm Link (the private URL)'
      - name: 'ctaText'
        label: 'CTA Button Text'
        required: false
        default: 'Send Me the Listings'
      - name: 'showWhatsappLink'
        label: 'Show WhatsApp link in footer'
        widget: 'boolean'
        required: false
        default: false
      - name: 'whatsappUrl'
        label: 'WhatsApp URL'
        required: false
        pattern:
          - '^https://wa\.me/[0-9]+.*$'
          - 'Enter a link like https://wa.me/16476684646 with the full phone number.'
        hint: 'Use https://wa.me/<number> optionally followed by ?text=… for a prefilled message.'
      - name: 'thankYouGuideLabel'
        label: 'Buyer’s Guide Label (optional)'
        required: false
      - name: 'thankYouGuideUrl'
        label: 'Buyer’s Guide PDF URL (optional)'
        required: false
      - name: 'seoDescription'
        label: 'SEO Description'
        widget: 'text'
        required: false
      - name: 'heroImage'
        label: 'Hero Image'
        widget: 'image'
        required: false
        hint: 'Upload a 1920×1080 (16:9) JPG/PNG for best results.'
      - name: 'legacyTitle'
        label: 'Legacy Page Title'
        widget: 'string'
        required: false
        hint: 'Optional: only needed if older automations depend on the original title field.'

  - name: 'events'
    label: 'Community Events'
    label_singular: 'Event'
    folder: 'public/data/events'
    create: true
    identifier_field: 'slug'
    slug: '{{slug}}'
    extension: 'json'
    format: 'json'
    # Note: Decap does not support setting a default sort; editors must use the Sort menu.
    summary: "{{title}} — {{startDate | date('ddd, MMM D h:mm a')}} — {{town | default('')}}{{locationName | ternary(', ', '')}}{{locationName | default('')}} — Status: {{status | upper}}{{hidden | ternary(' • HIDDEN', '')}}{{archived | ternary(' • ARCHIVED', '')}}"
    sortable_fields: ['startDate', 'status', 'commit_date']
    view_filters:
      - label: Published
        field: status
        pattern: '^(published|approved)$'
      - label: Unpublished
        field: status
        pattern: '^(draft|pending|archived)$'
      - label: Hidden
        field: hidden
        pattern: '^true$'
      - label: Not Hidden
        field: hidden
        pattern: '^(false|)$'
      - label: Archived
        field: archived
        pattern: '^true$'
      - label: Not Archived
        field: archived
        pattern: '^(false|)$'
    fields:
      - { name: 'title', label: 'Title' }
      - name: 'slug'
        label: 'Slug (URL part)'
        widget: 'string'
        pattern:
          - '^[a-z0-9-]+$'
          - 'Use lowercase letters, numbers, and dashes only.'
      - name: 'startDate'
        label: 'Start Date & Time'
        widget: 'datetime'
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
      - name: 'endDate'
        label: 'End Date & Time'
        widget: 'datetime'
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
        required: false
        hint: 'Leave blank for single-day events.'
      - name: 'allDay'
        label: 'All day event'
        widget: 'boolean'
        required: false
        default: false
      - name: 'use_daily_schedule'
        label: 'Enable Daily Schedule'
        widget: 'boolean'
        required: false
        default: false
        hint: 'Toggle on to manage per-day hours below. Leave off to fall back to the start/end fields.'
      - name: 'daily_schedule'
        label: 'Daily Schedule'
        widget: 'dailySchedule'
        required: false
        collapsed: false
        hint: 'Add one row per day. Data stays saved even if the toggle is off.'
      - name: 'recurrence'
        label: 'Recurrence (RRULE)'
        widget: 'string'
        required: false
        hint: 'Optional RRULE string for repeating events (e.g., FREQ=WEEKLY;BYDAY=SA).'
      - name: 'category'
        label: 'Category'
        widget: 'select'
        options: ['Family', 'Festivals', 'Sports', 'Golf', 'Markets', 'Arts & Culture', 'Outdoors', 'Other']
      - name: 'town'
        label: 'Town / Area'
        widget: 'select'
        options: ['Aurora', 'Uxbridge', 'Georgina', 'Stouffville', 'East Gwillimbury', 'Newmarket', 'Scugog', 'Toronto-adjacent']
      - { name: 'locationName', label: 'Location Name' }
      - { name: 'address', label: 'Street Address' }
      - name: 'lat'
        label: 'Latitude'
        widget: 'number'
        required: false
      - name: 'lng'
        label: 'Longitude'
        widget: 'number'
        required: false
      - name: 'priceType'
        label: 'Price Type'
        widget: 'select'
        options: ['Free', 'Paid', 'Mixed']
        default: 'Free'
      - name: 'priceNote'
        label: 'Price Note'
        widget: 'text'
        required: false
      - name: 'badges'
        label: 'Badges'
        widget: 'select'
        multiple: true
        options: ['Family-friendly', 'Seasonal', 'Outdoors', 'Pets OK', 'Accessible']
        required: false
      - name: 'image'
        label: 'Image'
        widget: 'image'
        required: false
        hint: 'Upload a 3:2 or 16:9 photo. Optional — a neutral placeholder appears if empty.'
      - name: 'summary'
        label: 'List Summary (140–180 characters)'
        widget: 'text'
        hint: 'Appears in card view. Keep concise and informative.'
      - name: 'description'
        label: 'Full Description'
        widget: 'markdown'
      - name: 'organizerName'
        label: 'Organizer Name'
        required: false
      - name: 'organizerUrl'
        label: 'Organizer URL'
        required: false
      - name: 'eventUrl'
        label: 'Event Website'
        widget: 'string'
        required: true
      - name: 'icsUrl'
        label: 'ICS File URL'
        widget: 'string'
        required: false
        hint: 'Optional external calendar link. Leave blank to auto-generate.'
      - name: 'featured'
        label: 'Featured This Week'
        widget: 'boolean'
        required: false
        default: false
      - name: 'hidden'
        label: 'Hide from public lists & sitemap'
        widget: 'boolean'
        required: false
        default: false
      - name: 'archived'
        label: 'Move to Archive'
        widget: 'boolean'
        required: false
        default: false
      - name: 'status'
        label: 'Status'
        widget: 'select'
        options: ['draft', 'pending', 'approved', 'published', 'archived']
        default: 'pending'
      - name: 'source'
        label: 'Source'
        widget: 'select'
        options: ['manual', 'feed']
        default: 'manual'
      - name: 'sourceRef'
        label: 'Source Reference'
        required: false
        hint: 'Auto-filled for feed items. Leave blank for manual events.'
      - name: 'updatedAt'
        label: 'Last Updated'
        widget: 'datetime'
        required: false
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
        hint: 'Optional — ingestion fills this automatically.'

  - name: 'pending-events'
    label: 'User Submitted Events (Pending)'
    label_singular: 'Pending Event'
    folder: 'public/data/events-pending'
    create: false
    identifier_field: 'slug'
    slug: '{{slug}}'
    extension: 'json'
    format: 'json'
    summary: "{{title}} — {{startDate | date('ddd, MMM D h:mm a')}} — {{town | default('')}}"
    fields:
      - { name: 'title', label: 'Title' }
      - name: 'slug'
        label: 'Slug (URL part)'
        widget: 'string'
        pattern:
          - '^[a-z0-9-]+$'
          - 'Use lowercase letters, numbers, and dashes only.'
      - name: 'status'
        label: 'Status'
        widget: 'select'
        options: ['pending', 'approved', 'published', 'archived']
        default: 'pending'
      - name: 'startDate'
        label: 'Start Date & Time'
        widget: 'datetime'
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
      - name: 'endDate'
        label: 'End Date & Time'
        widget: 'datetime'
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
        required: false
      - name: 'allDay'
        label: 'All day event'
        widget: 'boolean'
        required: false
        default: false
      - name: 'userEventType'
        label: 'Submitted Event Type'
        widget: 'select'
        options:
          [
            'Community',
            'Sports',
            'Family',
            'Arts & Culture',
            'Education',
            'Business/Networking',
            'Charity',
            'Other',
          ]
      - name: 'categoryTags'
        label: 'Category Tags'
        widget: 'select'
        multiple: true
        required: false
        options:
          [
            'Community',
            'Sports',
            'Family',
            'Arts & Culture',
            'Education',
            'Business/Networking',
            'Charity',
            'Other',
            'Fall',
            'Winter',
            'Spring',
            'Summer',
            'Holiday',
          ]
      - name: 'audienceTags'
        label: 'Audience Tags'
        widget: 'select'
        multiple: true
        required: false
        options: ['All ages', 'Kids', 'Teens', 'Adults', 'Seniors', 'Families']
      - name: 'town'
        label: 'City / Town'
        widget: 'select'
        options:
          [
            'Georgina',
            'East Gwillimbury',
            'Aurora',
            'Stouffville',
            'Uxbridge',
            'Scugog',
            'Newmarket',
            'Nearby/Other (North of Toronto)',
          ]
      - { name: 'locationName', label: 'Venue Name' }
      - { name: 'address', label: 'Street Address' }
      - name: 'postalCode'
        label: 'Postal Code'
        widget: 'string'
        required: false
      - name: 'priceType'
        label: 'Cost'
        widget: 'select'
        options: ['Free', 'Paid']
        default: 'Free'
      - name: 'priceFrom'
        label: 'Price From'
        widget: 'string'
        required: false
      - name: 'ticketsUrl'
        label: 'Tickets URL'
        widget: 'string'
        required: false
      - name: 'registrationUrl'
        label: 'Registration / Info URL'
        widget: 'string'
        required: false
      - name: 'image'
        label: 'Image'
        widget: 'image'
        required: false
        hint: 'Optional hero image uploaded by the community member.'
      - name: 'summary'
        label: 'Short Description'
        widget: 'text'
        hint: '140–200 characters max.'
      - name: 'description'
        label: 'Full Description'
        widget: 'markdown'
        required: false
      - name: 'organizerName'
        label: 'Organizer Name'
      - name: 'organizerEmail'
        label: 'Organizer Email (private)'
        widget: 'string'
      - name: 'eventUrl'
        label: 'Public Event Link'
        widget: 'string'
        required: false
      - name: 'source'
        label: 'Source'
        widget: 'hidden'
        default: 'user'
      - name: 'submittedAt'
        label: 'Submitted At'
        widget: 'datetime'
        required: false
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        time_format: 'HH:mm'
      - name: 'contactConsent'
        label: 'Consent'
        widget: 'boolean'
        required: false
