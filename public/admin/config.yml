backend:
  name: github
  repo: FinallyHomeAgents/northsidegta-site
  branch: main
  base_url: https://nsgta-decap-oauth.vercel.app
  auth_endpoint: /auth

media_folder: "public/collections"   # where uploaded hero images are saved in repo
public_folder: "/collections"        # how the images are referenced on the site

publish_mode: editorial_workflow     # lets you save drafts or publish immediately

collections:
  - name: "collections"
    label: "Curated Pages"
    label_singular: "Curated Page"
    folder: "data/collections"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "e.g., Top Homes in Newmarket Under $800K" }
      - { label: "Slug", name: "slug", widget: "string", hint: "newmarket-under-800k" }
      - { label: "Intro", name: "intro", widget: "text", required: false, hint: "1–2 friendly lines" }
      - { label: "Hero Image", name: "heroImage", widget: "image", hint: "1200x630, <300KB" }
      - { label: "REALM Link", name: "realmLink", widget: "string", hint: "Paste your REALM shared link" }