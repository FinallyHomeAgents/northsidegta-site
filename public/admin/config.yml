backend:
  name: github
  repo: FinallyHomeAgents/northsidegta-site   # <— your repo
  branch: main
  # NOTE: For production login you’ll add an OAuth proxy later.
  # The CMS will load now; auth setup is the next step.

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "collections"
    label: "Curated Collections"
    folder: "public/data/collections"
    create: true
    extension: "json"
    format: "json"
    fields:
      - { name: "title", label: "Page Title" }
      - { name: "slug", label: "Slug (URL part)", pattern: ["^[a-z0-9-]+$", "Use lowercase and dashes only"] }
      - { name: "intro", label: "Intro (optional)", required: false }
      - { name: "realmLink", label: "Realm Link (the private URL)" }
      - { name: "heroImage", label: "Hero Image", widget: "image" }