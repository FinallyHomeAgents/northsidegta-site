  </defs>
  <rect width="800" height="600" fill="#173f08"/>
  <image href="/Images/matthew.jpg" x="0" y="0" width="400" height="600" preserveAspectRatio="xMidYMid slice" clip-path="url(#left)"/>
  <image href="/Images/landon.jpg" x="400" y="0" width="400" height="600" preserveAspectRatio="xMidYMid slice" clip-path="url(#right)"/>
  <rect x="385" y="0" width="30" height="600" fill="#f4efe5" opacity="0.92"/>
